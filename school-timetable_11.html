        html += '<div class="ct-row" style="align-items:center;flex-wrap:wrap">';
        html += '<input data-teachrename="'+escapeHtml(name)+'" value="'+escapeHtml(name)+'" title="Edit name — updates it everywhere in the timetable" style="width:120px;min-width:110px;font-weight:600;flex:none"/>';
        html += '<input placeholder="Designation e.g. TGT English" data-tdfield="designation|'+escapeHtml(name)+'" value="'+escapeHtml(info.designation)+'" style="flex:1.2;min-width:120px"/>';
        html += '<select data-tdfield="type|'+escapeHtml(name)+'" style="max-width:112px">';
        html += '<option value="Permanent" '+(info.type==='Permanent'?'selected':'')+'>Permanent</option>';
        html += '<option value="Guest" '+(info.type==='Guest'?'selected':'')+'>Guest</option>';
        html += '</select>';
        html += '<input placeholder="Email or WhatsApp number" data-tdfield="contact|'+escapeHtml(name)+'" value="'+escapeHtml(info.contact)+'" style="flex:1.2;min-width:150px"/>';
        html += '</div>';
      });
      return html;
    }

    function body(){
      let html = '<h3>Manage teachers &amp; subjects</h3><div class="sub">These fill the dropdown when editing a period — admins can still type anything else too</div>';
      html += '<div class="auto-row" style="margin:10px 0 14px">';
      html += '<button class="btn btn-ghost" id="tdPrintDetails" style="flex:1">Print teacher details</button>';
      html += '<button class="btn btn-primary" id="tdExcelDetails" style="flex:1">Download Excel</button>';
      html += '</div>';
      html += listBlock('Subjects', 'subjects', 'e.g. Mathematics');
      html += listBlock('Teachers', 'teachers', 'e.g. Mr. Rao');
      html += teacherDetailsBlock();
      html += '<div class="modal-actions"><button class="btn btn-primary" id="pClose">Done</button></div>';
      return html;
    }

    function paint(){
      overlay.innerHTML = '<div class="modal">' + body() + '</div>';
      overlay.querySelector('#pClose').onclick = closeModal;
      overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
      const tdPrintDetails = overlay.querySelector('#tdPrintDetails');
      if(tdPrintDetails) tdPrintDetails.onclick = () => printTeacherDetailsOnly();
      const tdExcelDetails = overlay.querySelector('#tdExcelDetails');
      if(tdExcelDetails) tdExcelDetails.onclick = () => downloadTeacherDetailsOnlyExcel();

      overlay.querySelectorAll('[data-teachrename]').forEach(inp => {
        inp.onchange = () => {
          const oldName = inp.dataset.teachrename;
          const newName = inp.value.trim();
          if(!newName){ inp.value = oldName; return; }
          if(newName === oldName) return;
          const merging = (state.data.teachers||[]).some(t => t.toLowerCase() === newName.toLowerCase() && t.toLowerCase() !== oldName.toLowerCase());
          if(merging && !window.confirm('"'+newName+'" already exists as a teacher. Merge "'+oldName+'" into "'+newName+'"? Every period assigned to '+oldName+' will move to '+newName+'.')){
            inp.value = oldName;
            return;
          }
          renameTeacher(oldName, newName);
          paint();
        };
      });

      overlay.querySelectorAll('[data-del]').forEach(el => {
        el.onclick = (e) => {
          e.preventDefault();
          const [key, val] = el.dataset.del.split('|');
          state.data[key] = (state.data[key]||[]).filter(x => x !== val);
          selected[key].delete(val);
          if(key === 'teachers' && state.data.teacherInfo) delete state.data.teacherInfo[val];
          if(key === 'teachers') cleanupSubstitutePreferencesFor(val);
          saveData(); paint();
        };
      });
      overlay.querySelectorAll('[data-bulkcheck]').forEach(el => {
        el.onchange = () => {
          const [key, val] = el.dataset.bulkcheck.split('|');
          if(el.checked) selected[key].add(val); else selected[key].delete(val);
          paint();
        };
      });
      overlay.querySelectorAll('[data-selectall]').forEach(el => {
        el.onclick = () => {
          const key = el.dataset.selectall;
          (state.data[key]||[]).forEach(v => selected[key].add(v));
          paint();
        };
      });
      overlay.querySelectorAll('[data-clearsel]').forEach(el => {
        el.onclick = () => { selected[el.dataset.clearsel].clear(); paint(); };
      });
      overlay.querySelectorAll('[data-bulkdelete]').forEach(el => {
        el.onclick = () => {
          const key = el.dataset.bulkdelete;
          if(!selected[key].size){ window.alert('Nothing selected.'); return; }
          if(!window.confirm('Delete '+selected[key].size+' selected '+(key==='subjects'?'subject(s)':'teacher(s)')+'? This cannot be undone.')) return;
          state.data[key] = (state.data[key]||[]).filter(v => !selected[key].has(v));
          if(key === 'teachers' && state.data.teacherInfo){
            selected[key].forEach(v => delete state.data.teacherInfo[v]);
          }
          if(key === 'teachers'){
            selected[key].forEach(v => cleanupSubstitutePreferencesFor(v));
          }
          selected[key].clear();
          saveData(); paint();
        };
      });
      overlay.querySelectorAll('[data-addbtn]').forEach(el => {
        el.onclick = () => {
          const key = el.dataset.addbtn;
          const input = overlay.querySelector('[data-addinput="'+key+'"]');
          const val = (input.value||'').trim();
          if(!val) return;
          if(!state.data[key]) state.data[key] = [];
          if(state.data[key].some(x => x.toLowerCase() === val.toLowerCase())){ window.alert('Already in the list.'); return; }
          state.data[key].push(val);
          saveData(); paint();
        };
      });
      overlay.querySelectorAll('[data-addinput]').forEach(el => {
        el.onkeydown = (e) => { if(e.key === 'Enter'){ overlay.querySelector('[data-addbtn="'+el.dataset.addinput+'"]').click(); } };
      });
      const loadDoE = overlay.querySelector('#loadDoESubjects');
      if(loadDoE) loadDoE.onclick = () => {
        if(!state.data.subjects) state.data.subjects = [];
        let added = 0;
        DOE_DELHI_SUBJECTS.forEach(s => {
          if(!state.data.subjects.some(x => x.toLowerCase() === s.toLowerCase())){
            state.data.subjects.push(s); added++;
          }
        });
        saveData();
        window.alert(added ? 'Added '+added+' new subject(s) from the DoE Delhi Class 6–12 list.' : 'All of those subjects were already in your list.');
        paint();
      };
      overlay.querySelectorAll('[data-importfile]').forEach(el => {
        el.onchange = () => {
          const file = el.files[0];
          if(!file) return;
          const key = el.dataset.importfile;
          importNamesFromFile(file, (names, err) => {
            el.value = '';
            if(err){ window.alert('Could not read that file. Please upload a valid Excel (.xlsx/.xls) or CSV file.'); return; }
            if(!state.data[key]) state.data[key] = [];
            let added = 0, skipped = 0;
            names.forEach(n => {
              if(state.data[key].some(x => x.toLowerCase() === n.toLowerCase())){ skipped++; }
              else { state.data[key].push(n); added++; }
            });
            saveData();
            window.alert('Imported '+added+' new '+(key==='teachers'?'teacher(s)':'subject(s)')+'.'+(skipped ? ' ('+skipped+' duplicate(s) skipped.)' : ''));
            paint();
          });
        };
      });
      overlay.querySelectorAll('[data-tdfield]').forEach(el => {
        el.onchange = () => {
          const [field, name] = el.dataset.tdfield.split('|');
          setTeacherInfo(name, field, el.value.trim());
        };
      });
    }

    paint();
    document.body.appendChild(overlay);
    function closeModal(){ state.managingPeople = false; overlay.remove(); render(); }
  }

  // ---------- absent teacher / substitution helpers ----------
  function weekdayFromDateStr(str){
    const [y,m,d] = str.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const names = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    return names[dt.getDay()];
  }
  function teacherDayPeriods(teacher, day){
    const periods = new Set();
    allSectionIds().forEach(id => {
      state.data.sections[id][day].forEach((s,p) => {
        if(splitList(s.teacher).some(t => t.toLowerCase() === teacher.toLowerCase())) periods.add(p);
      });
    });
    return periods;
  }
  function teachersActiveOnDay(day){
    const set = new Set();
    allSectionIds().forEach(id => {
      state.data.sections[id][day].forEach(s => { splitList(s.teacher).forEach(t => set.add(t)); });
    });
    return Array.from(set).sort();
  }
  function absentTeacherPeriodSlots(teacher, day){
    const list = [];
    allSectionIds().forEach(id => {
      state.data.sections[id][day].forEach((s,p) => {
        if(splitList(s.teacher).some(t => t.toLowerCase() === teacher.toLowerCase())){
          list.push({id, p, subject:s.subject, room:s.room});
        }
      });
    });
    list.sort((a,b) => a.p-b.p);
    return list;
  }
  function isTeacherBusy(teacher, day, p){
    return allSectionIds().some(id => splitList(state.data.sections[id][day][p].teacher).some(t => t.toLowerCase() === teacher.toLowerCase()));
  }
  function longestRun(periodSet){
    const arr = Array.from(periodSet).sort((a,b) => a-b);
    if(!arr.length) return 0;
    let best=1, cur=1;
    for(let i=1;i<arr.length;i++){
      if(arr[i] === arr[i-1]+1){ cur++; best = Math.max(best,cur); } else cur = 1;
    }
    return best;
  }
  function sessionPeriodsFor(teacherName, draft, excludeKey){
    const periods = [];
    Object.keys(draft).forEach(k => {
      if(k === excludeKey) return;
      if(draft[k] && draft[k].toLowerCase() === teacherName.toLowerCase()){
        const parts = k.split('|');
        const p = parseInt(parts[parts.length-1], 10);
        if(!isNaN(p)) periods.push(p);
      }
    });
    return periods;
  }
  // Session limits let admin loosen/tighten just this one arrangement (e.g. a sports day)
  // without touching the global defaults in Settings.
  function sessionMaxPeriodsPerDay(){
    return (state.subsMaxDayOverride != null) ? state.subsMaxDayOverride : state.data.settings.maxPeriodsPerDay;
  }
  function sessionMaxContinuousPeriods(){
    return (state.subsMaxContOverride != null) ? state.subsMaxContOverride : state.data.settings.maxContinuousPeriods;
  }
  // A specific teacher's own limits (set in the Teacher limits submenu) win over the
  // per-arrangement override, which wins over the global default.
  function getTeacherMaxOverride(teacherName){
    if(!state.data.teacherMaxOverrides) return null;
    return state.data.teacherMaxOverrides[teacherName.toLowerCase()] || null;
  }
  function setTeacherMaxOverride(teacherName, field, value){
    if(!state.data.teacherMaxOverrides) state.data.teacherMaxOverrides = {};
    const key = teacherName.toLowerCase();
    const cur = state.data.teacherMaxOverrides[key] || {};
    if(value == null){ delete cur[field]; } else { cur[field] = value; }
    if(Object.keys(cur).length) state.data.teacherMaxOverrides[key] = cur;
    else delete state.data.teacherMaxOverrides[key];
    saveData();
  }
  function effectiveMaxPeriodsPerDay(teacherName){
    const t = getTeacherMaxOverride(teacherName);
    if(t && t.maxDay != null) return t.maxDay;
    return sessionMaxPeriodsPerDay();
  }
  function effectiveMaxContinuousPeriods(teacherName){
    const t = getTeacherMaxOverride(teacherName);
    if(t && t.maxCont != null) return t.maxCont;
    return sessionMaxContinuousPeriods();
  }
  // Teachers marked exempt (e.g. seniors, non-teaching duty staff) never appear as
  // substitute candidates, manually or via auto-arrange.
  function isExemptSubstitute(teacherName){
    return (state.data.exemptSubstitutes||[]).some(x => x.toLowerCase() === teacherName.toLowerCase());
  }
  function toggleExemptSubstitute(teacherName){
    if(!Array.isArray(state.data.exemptSubstitutes)) state.data.exemptSubstitutes = [];
    const idx = state.data.exemptSubstitutes.findIndex(x => x.toLowerCase() === teacherName.toLowerCase());
    if(idx >= 0) state.data.exemptSubstitutes.splice(idx, 1); else state.data.exemptSubstitutes.push(teacherName);
    saveData();
  }
  // Whether a teacher teaches a given subject anywhere in the current weekly timetable —
  // used to prefer subject-matched substitutes when auto-arranging.
  function teacherTeachesSubject(teacherName, subject){
    if(!subject) return false;
    const subjLower = subject.toLowerCase();
    return allSectionIds().some(id => {
      const sec = state.data.sections[id];
      return DAYS.some(day => sec[day].some(slot =>
        splitList(slot.teacher).some(t => t.toLowerCase() === teacherName.toLowerCase())
        && splitList(slot.subject).some(s => s.toLowerCase() === subjLower)
      ));
    });
  }
  function getPreferredSubs(absentTeacherName){
    if(!state.data.substitutePreferences) return [];
    return state.data.substitutePreferences[absentTeacherName.toLowerCase()] || [];
  }
  function togglePreferredSub(absentTeacherName, subName){
    if(!state.data.substitutePreferences) state.data.substitutePreferences = {};
    const key = absentTeacherName.toLowerCase();
    const list = state.data.substitutePreferences[key] ? state.data.substitutePreferences[key].slice() : [];
    const idx = list.findIndex(x => x.toLowerCase() === subName.toLowerCase());
    if(idx >= 0) list.splice(idx, 1); else list.push(subName);
    state.data.substitutePreferences[key] = list;
    saveData();
  }
  function cleanupSubstitutePreferencesFor(name){
    if(!state.data.substitutePreferences) return;
    delete state.data.substitutePreferences[name.toLowerCase()];
    Object.keys(state.data.substitutePreferences).forEach(key => {
      state.data.substitutePreferences[key] = state.data.substitutePreferences[key].filter(x => x.toLowerCase() !== name.toLowerCase());
    });
    saveData();
  }
  function dedupeCaseInsensitive(arr){
    const seen = new Set();
    return arr.filter(x => {
      const k = x.toLowerCase();
      if(seen.has(k)) return false;
      seen.add(k); return true;
    });
  }
  // Renames a teacher everywhere: the master list, every timetable cell they're assigned
  // to, class/co-class teacher fields, their details, limits, exemptions, preferred-substitute
  // lists (as both the absent teacher and as someone's preference), and saved substitution
  // records. If newName matches an existing teacher, the two are merged.
  function renameTeacher(oldName, newName){
    newName = (newName||'').trim();
    if(!newName || newName === oldName) return false;
    const oldLower = oldName.toLowerCase();
    const newLower = newName.toLowerCase();
    const mergingIntoExisting = (state.data.teachers||[]).some(t => t.toLowerCase() === newLower && t.toLowerCase() !== oldLower);

    // 1. Master list
    const idx = (state.data.teachers||[]).findIndex(t => t.toLowerCase() === oldLower);
    if(mergingIntoExisting){
      if(idx >= 0) state.data.teachers.splice(idx, 1);
    } else if(idx >= 0){
      state.data.teachers[idx] = newName;
    } else if(!(state.data.teachers||[]).some(t => t.toLowerCase() === newLower)){
      state.data.teachers.push(newName);
    }

    // 2. Every timetable cell (token-aware — teacher fields can be comma-separated)
    allSectionIds().forEach(id => {
      const sec = state.data.sections[id];
      DAYS.forEach(day => {
        sec[day].forEach(slot => {
          if(!slot.teacher) return;
          const tokens = splitList(slot.teacher);
          if(!tokens.some(t => t.toLowerCase() === oldLower)) return;
          const renamed = tokens.map(t => t.toLowerCase() === oldLower ? newName : t);
          slot.teacher = dedupeCaseInsensitive(renamed).join(', ');
        });
      });
    });

    // 3. Class teacher / co-class teacher
    Object.values(state.data.classInfo || {}).forEach(info => {
      if(info.classTeacher && info.classTeacher.toLowerCase() === oldLower) info.classTeacher = newName;
      if(info.coClassTeacher && info.coClassTeacher.toLowerCase() === oldLower) info.coClassTeacher = newName;
    });

    // 4. Teacher details (designation/type/contact) — keyed by exact name
    if(state.data.teacherInfo){
      const oldKey = Object.keys(state.data.teacherInfo).find(k => k.toLowerCase() === oldLower);
      if(oldKey){
        const info = state.data.teacherInfo[oldKey];
        delete state.data.teacherInfo[oldKey];
        if(!state.data.teacherInfo[newName]) state.data.teacherInfo[newName] = info;
      }
    }

    // 5. Per-teacher period limits — keyed by lowercase name
    if(state.data.teacherMaxOverrides && state.data.teacherMaxOverrides[oldLower]){
      const ov = state.data.teacherMaxOverrides[oldLower];
      delete state.data.teacherMaxOverrides[oldLower];
      if(!state.data.teacherMaxOverrides[newLower]) state.data.teacherMaxOverrides[newLower] = ov;
    }

    // 6. Substitute exemptions list
    if(Array.isArray(state.data.exemptSubstitutes)){
      state.data.exemptSubstitutes = dedupeCaseInsensitive(
        state.data.exemptSubstitutes.map(t => t.toLowerCase() === oldLower ? newName : t)
      );
    }

    // 7. Preferred substitutes — both as an absent-teacher key and inside other teachers' lists
    if(state.data.substitutePreferences){
      if(state.data.substitutePreferences[oldLower]){
        const list = state.data.substitutePreferences[oldLower];
        delete state.data.substitutePreferences[oldLower];
        state.data.substitutePreferences[newLower] = dedupeCaseInsensitive((state.data.substitutePreferences[newLower]||[]).concat(list));
      }
      Object.keys(state.data.substitutePreferences).forEach(key => {
        state.data.substitutePreferences[key] = dedupeCaseInsensitive(
          state.data.substitutePreferences[key].map(t => t.toLowerCase() === oldLower ? newName : t)
        );
      });
    }

    // 8. Saved substitution arrangements (historical records)
    Object.keys(state.data.substitutions || {}).forEach(date => {
      (state.data.substitutions[date] || []).forEach(rec => {
        if(rec.absentTeacher && rec.absentTeacher.toLowerCase() === oldLower) rec.absentTeacher = newName;
        (rec.assignments || []).forEach(a => {
          if(a.sub && a.sub.toLowerCase() === oldLower) a.sub = newName;
        });
      });
    });

    saveData();
    return true;
  }

  // Which teachers are free each period on a given day, excluding whoever's marked absent —
  // powers the "Vacant teachers timetable" helper view.
  function vacantTeachersForDay(day, absentTeachers){
    const result = [];
    for(let p=0; p<PERIOD_COUNT; p++){
      const free = teacherOptions().filter(t =>
        !absentTeachers.some(a => a.toLowerCase() === t.toLowerCase()) &&
        !isTeacherBusy(t, day, p)
      ).sort((a,b) => a.localeCompare(b));
      result.push({ p, free });
    }
    return result;
  }

  function candidateWarnings(teacherName, day, p, draftKey, draft){
    if(!teacherName) return '';
    const warnings = [];
    const basePeriods = teacherDayPeriods(teacherName, day);
    const sessionPeriods = sessionPeriodsFor(teacherName, draft, draftKey);
    const combined = new Set([...basePeriods, ...sessionPeriods]);
    const projectedCount = combined.has(p) ? combined.size : combined.size + 1;
    const maxDay = effectiveMaxPeriodsPerDay(teacherName);
    const maxCont = effectiveMaxContinuousPeriods(teacherName);
    const withNew = new Set(combined); withNew.add(p);
    const run = longestRun(withNew);
    if(projectedCount > maxDay) warnings.push(projectedCount+'/'+maxDay+' periods that day');
    if(run > maxCont) warnings.push(run+' continuous periods (limit '+maxCont+')');
    return warnings.join('; ');
  }
  // A candidate is only offered as an option if they're genuinely free that period:
  // not one of today's absent teachers, not already teaching elsewhere that period,
  // and not already picked as someone else's substitute for that same period in this session.
  function candidateIsAvailable(teacherName, day, p, absentTeachers, draft, draftKey){
    if(absentTeachers.some(a => a.toLowerCase() === teacherName.toLowerCase())) return false;
    if(isExemptSubstitute(teacherName)) return false;
    if(isTeacherBusy(teacherName, day, p)) return false;
    const usedThisPeriod = Object.keys(draft).some(k => {
      if(k === draftKey) return false;
      const parts = k.split('|');
      const kp = parseInt(parts[parts.length-1], 10);
      return kp === p && draft[k] && draft[k].toLowerCase() === teacherName.toLowerCase();
    });
    if(usedThisPeriod) return false;
    return true;
  }

  // All periods needing cover across every selected absent teacher, in fill order
  // (period-by-period, so auto-arrange balances load sensibly as it goes).
  function computeCoverRows(day){
    let rows = [];
    state.subsAbsentTeachers.forEach(at => {
      absentTeacherPeriodSlots(at, day).forEach(slot => rows.push(Object.assign({absentTeacher: at}, slot)));
    });
    rows.sort((a,b) => a.p - b.p || a.absentTeacher.localeCompare(b.absentTeacher));
    return rows;
  }

  // Picks the best free teacher for this period: preferred substitutes (if set for this
  // absent teacher) come first, then — if subject-matching is on — someone who already
  // teaches the same subject, then whoever is least loaded that day. Returns null if
  // nobody can take it without breaking a limit — auto-arrange leaves that slot for
  // manual review rather than silently ignoring limits.
  function bestCandidateFor(slot, day, draftKey){
    const preferred = getPreferredSubs(slot.absentTeacher);
    const matchSubject = !!state.data.settings.preferSubjectMatch;
    const candidates = teacherOptions().filter(t =>
      candidateIsAvailable(t, day, slot.p, state.subsAbsentTeachers, state.subsDraft, draftKey)
    );
    const scored = candidates.map(t => {
      const basePeriods = teacherDayPeriods(t, day);
      const sessionPeriods = sessionPeriodsFor(t, state.subsDraft, draftKey);
      const combined = new Set([...basePeriods, ...sessionPeriods]);
      const projectedCount = combined.has(slot.p) ? combined.size : combined.size + 1;
      const withNew = new Set(combined); withNew.add(slot.p);
      const run = longestRun(withNew);
      const violates = (projectedCount > effectiveMaxPeriodsPerDay(t)) || (run > effectiveMaxContinuousPeriods(t));
      const prefIdx = preferred.findIndex(x => x.toLowerCase() === t.toLowerCase());
      const prefRank = prefIdx >= 0 ? prefIdx : 999;
      const subjectMiss = (matchSubject && !teacherTeachesSubject(t, slot.subject)) ? 1 : 0;
      return { t, projectedCount, violates, prefRank, subjectMiss };
    });
    scored.sort((a,b) =>
      (a.violates - b.violates) ||
      (a.prefRank - b.prefRank) ||
      (a.subjectMiss - b.subjectMiss) ||
      (a.projectedCount - b.projectedCount) ||
      a.t.localeCompare(b.t)
    );
    const clean = scored.filter(s => !s.violates);
    return clean.length ? clean[0].t : null;
  }

  // Fills every empty slot with the best available substitute, respecting the limits.
  // Existing manual picks are left untouched unless overwrite is true.
  function autoArrangeSubstitutes(day, overwrite){
    const rows = computeCoverRows(day);
    let filled = 0, unresolved = 0;
    rows.forEach(slot => {
      const draftKey = slot.absentTeacher+'|'+slot.p;
      if(!overwrite && state.subsDraft[draftKey]) return;
      const pick = bestCandidateFor(slot, day, draftKey);
      if(pick){ state.subsDraft[draftKey] = pick; filled++; }
      else { delete state.subsDraft[draftKey]; unresolved++; }
    });
    return { filled, unresolved, total: rows.length };
  }

  function dateArrangementRows(date){
    const recs = state.data.substitutions[date] || [];
    const rows = [];
    recs.forEach(rec => {
      rec.assignments.forEach(a => {
        rows.push({
          Date: date,
          Day: rec.day,
          'Absent teacher': rec.absentTeacher,
          Period: state.data.periodNames[a.p] + ' (' + state.data.periodTimes[a.p] + ')',
          Class: displaySid(a.id),
          Subject: a.subject || '',
          Substitute: a.sub
        });
      });
    });
    return rows;
  }
  function downloadDateArrangementExcel(date){
    if(typeof XLSX === 'undefined'){ window.alert('The Excel export library did not load — check your connection and try again.'); return; }
    const rows = dateArrangementRows(date);
    const wb = XLSX.utils.book_new();
    const ws = rows.length ? XLSX.utils.json_to_sheet(rows) : XLSX.utils.aoa_to_sheet([['No substitute assignments recorded for '+date]]);
    const footer = signatureFooterRows();
    if(footer.length) XLSX.utils.sheet_add_aoa(ws, footer, { origin: -1 });
    XLSX.utils.book_append_sheet(wb, ws, 'Leave arrangement');
    XLSX.writeFile(wb, 'leave-arrangement-'+date+'.xlsx');
  }
  function printDateArrangement(date){
    const rows = dateArrangementRows(date);
    let html = '<h2>Leave / substitution arrangement — '+escapeHtml(date)+'</h2>';
    if(!rows.length){
      html += '<p>No substitute assignments recorded for this date.</p>';
    } else {
      html += '<table class="print-table"><thead><tr><th>Absent teacher</th><th>Day</th><th>Period</th><th>Class</th><th>Subject</th><th>Substitute</th></tr></thead><tbody>';
      rows.forEach(r => {
        html += '<tr><td>'+escapeHtml(r['Absent teacher'])+'</td><td>'+escapeHtml(r.Day)+'</td><td>'+escapeHtml(r.Period)+'</td><td>'+escapeHtml(r.Class)+'</td><td>'+escapeHtml(r.Subject)+'</td><td>'+escapeHtml(r.Substitute)+'</td></tr>';
      });
      html += '</tbody></table>';
    }
    document.getElementById('printArea').innerHTML = html + signatureBlockHtml();
    window.print();
  }
  function buildDateArrangementText(date){
    const recs = state.data.substitutions[date] || [];
    if(!recs.length) return 'No substitute arrangement recorded for '+date+'.';
    const lines = ['Leave / Substitution Arrangement — '+date+' ('+(recs[0].day||'')+')', ''];
    recs.forEach(rec => {
      lines.push('Absent: '+rec.absentTeacher);
      if(!rec.assignments.length){
        lines.push('  No substitutes assigned.');
      } else {
        rec.assignments.forEach(a => {
          lines.push('  P'+(a.p+1)+' '+state.data.periodNames[a.p]+' ('+state.data.periodTimes[a.p]+') — '+displaySid(a.id)+' '+(a.subject||'')+' \u2192 '+a.sub);
        });
      }
      lines.push('');
    });
    return lines.join('\n');
  }
  async function shareDateArrangement(date){
    const text = buildDateArrangementText(date);
    if(navigator.share){
      try{ await navigator.share({ title: 'Leave arrangement — '+date, text }); }
      catch(e){ /* user cancelled the share sheet, nothing to do */ }
      return;
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      try{
        await navigator.clipboard.writeText(text);
        window.alert('Sharing isn\'t supported in this browser, so the arrangement was copied to your clipboard instead — paste it into WhatsApp, email, or anywhere else.');
        return;
      }catch(e){ /* fall through to alert */ }
    }
    window.alert(text);
  }

            const hint = currentVal ? candidateWarnings(currentVal, day, slot.p, draftKey, state.subsDraft) : '';
            html += '<div class="period-row" style="align-items:flex-start;margin-bottom:10px">';
            html += '<div style="flex:1;font-size:12.5px;padding-top:8px"><b>P'+(slot.p+1)+'</b> '+escapeHtml(state.data.periodNames[slot.p])+'<br><span style="color:var(--ink-soft)">'+escapeHtml(displaySid(slot.id))+' · '+escapeHtml(slot.subject||'—')+'</span><br><span style="color:var(--ink-soft)">Absent: '+escapeHtml(slot.absentTeacher)+'</span></div>';
            html += '<div style="flex:1.3">';
            html += '<select data-subfor="'+escapeHtml(draftKey)+'">';
            html += '<option value="">— no substitute available —</option>';
            candidates.forEach(t => { html += '<option value="'+escapeHtml(t)+'" '+(t.toLowerCase()===currentVal.toLowerCase()?'selected':'')+'>'+escapeHtml(t)+'</option>'; });
            html += '</select>';
            if(!candidates.length) html += '<div class="sub-hint">⚠ No teachers are free this period — everyone is already teaching, absent, or exempt.</div>';
            html += '<div class="sub-hint" data-hintfor="'+escapeHtml(draftKey)+'">'+(hint ? '⚠ '+escapeHtml(hint) : '')+'</div>';
            html += '</div></div>';
          });
          html += '<button class="btn btn-primary" id="saveArrangement" style="width:100%;margin-top:6px">Save arrangement</button>';
        }
      }
      }

      html += '<div class="modal-actions"><button class="btn btn-ghost" id="subsClose">Close</button></div>';

      overlay.innerHTML = '<div class="modal modal-fullscreen">'+html+'</div>';

        const v = parseInt(overrideMaxDay.value, 10);

      };
      const overrideMaxCont = overlay.querySelector('#overrideMaxCont');
      if(overrideMaxCont) overrideMaxCont.onchange = () => {
        const v = parseInt(overrideMaxCont.value, 10);
        state.subsMaxContOverride = (v > 0) ? v : null;
        paint();
      };
      overlay.querySelectorAll('[data-prefchip]').forEach(chip => {
        chip.onclick = () => {

          togglePreferredSub(at, name);
          paint();
        };
      });

      overlay.querySelectorAll('[data-limitfield]').forEach(inp => {
        inp.onchange = () => {
          const [field, name] = inp.dataset.limitfield.split('|');
          const v = parseInt(inp.value, 10);
          setTeacherMaxOverride(name, field, (v > 0) ? v : null);
        };
      });
      overlay.querySelectorAll('[data-exemptchip]').forEach(chip => {
        chip.onclick = () => {
          toggleExemptSubstitute(chip.dataset.exemptchip);
          paint();
        };
      });
      const vacantDateInput = overlay.querySelector('#vacantDateInput');
      if(vacantDateInput) vacantDateInput.onchange = () => {
        state.subsDate = vacantDateInput.value; paint();
      };

      const dateInput = overlay.querySelector('#subsDateInput');
      if(dateInput) dateInput.onchange = () => {
        state.subsDate = dateInput.value; state.subsAbsentTeachers = []; state.subsDraft = {}; state.subsAutoNote = ''; paint();
      };
      const dateExcelBtn = overlay.querySelector('#dateExcel');
      if(dateExcelBtn) dateExcelBtn.onclick = () => downloadDateArrangementExcel(state.subsDate);
      const datePrintBtn = overlay.querySelector('#datePrint');
      if(datePrintBtn) datePrintBtn.onclick = () => printDateArrangement(state.subsDate);
      const dateShareBtn = overlay.querySelector('#dateShare');
      if(dateShareBtn) dateShareBtn.onclick = () => shareDateArrangement(state.subsDate);
      overlay.querySelectorAll('[data-dlxl]').forEach(el => { el.onclick = () => downloadDateArrangementExcel(el.dataset.dlxl); });
      overlay.querySelectorAll('[data-dlprint]').forEach(el => { el.onclick = () => printDateArrangement(el.dataset.dlprint); });
      overlay.querySelectorAll('[data-dlshare]').forEach(el => { el.onclick = () => shareDateArrangement(el.dataset.dlshare); });
      overlay.querySelectorAll('[data-abschip]').forEach(chip => {
        chip.onclick = () => {
          const name = chip.dataset.abschip;
          const idx = state.subsAbsentTeachers.findIndex(x => x.toLowerCase() === name.toLowerCase());
          if(idx >= 0) state.subsAbsentTeachers.splice(idx, 1); else state.subsAbsentTeachers.push(name);
          state.subsDraft = {};
          state.subsAutoNote = '';
          paint();
        };
      });
      const autoBtn = overlay.querySelector('#autoArrange');
      if(autoBtn) autoBtn.onclick = () => {
        const res = autoArrangeSubstitutes(day, false);
        state.subsAutoNote = res.unresolved
          ? '✅ Filled '+res.filled+' of '+res.total+' periods. '+res.unresolved+' need a manual pick — no one is free without breaking a limit.'
          : '✅ Filled '+res.filled+' of '+res.total+' periods automatically.';
        paint();
      };
      const autoAllBtn = overlay.querySelector('#autoArrangeAll');
      if(autoAllBtn) autoAllBtn.onclick = () => {
        if(!window.confirm('This replaces every substitute currently picked below, including manual ones. Continue?')) return;
        const res = autoArrangeSubstitutes(day, true);
        state.subsAutoNote = res.unresolved
          ? '✅ Filled '+res.filled+' of '+res.total+' periods. '+res.unresolved+' need a manual pick — no one is free without breaking a limit.'
          : '✅ Filled '+res.filled+' of '+res.total+' periods automatically.';
        paint();
      };
      const clearBtn = overlay.querySelector('#clearDraft');
      if(clearBtn) clearBtn.onclick = () => {
        state.subsDraft = {};
        state.subsAutoNote = '';
        paint();
      };
      overlay.querySelectorAll('[data-subfor]').forEach(sel => {
        sel.onchange = () => {
          const draftKey = sel.dataset.subfor;
          const val = sel.value;
          if(val) state.subsDraft[draftKey] = val; else delete state.subsDraft[draftKey];
          paint();
        };
      });
      const saveBtn = overlay.querySelector('#saveArrangement');
      if(saveBtn) saveBtn.onclick = () => {
        if(!state.data.substitutions[state.subsDate]) state.data.substitutions[state.subsDate] = [];
        state.data.substitutions[state.subsDate] = state.data.substitutions[state.subsDate]
          .filter(r => !state.subsAbsentTeachers.some(at => at.toLowerCase() === r.absentTeacher.toLowerCase()));
        state.subsAbsentTeachers.forEach(at => {
          const slots = absentTeacherPeriodSlots(at, day);
          const assignments = slots
            .filter(s => state.subsDraft[at+'|'+s.p])
            .map(s => ({ id:s.id, p:s.p, subject:s.subject, sub: state.subsDraft[at+'|'+s.p] }));
          state.data.substitutions[state.subsDate].push({ day, absentTeacher: at, assignments });
        });
        saveData();
        state.subsDraft = {};
        state.subsAbsentTeachers = [];
        state.subsAutoNote = '';
        paint();
      };
      overlay.querySelectorAll('[data-viewrec]').forEach(el => {
        el.onclick = () => { viewingKey = (viewingKey === el.dataset.viewrec) ? null : el.dataset.viewrec; paint(); };
      });
      overlay.querySelectorAll('[data-delrec]').forEach(el => {
        el.onclick = () => {
          const [dt, idx] = el.dataset.delrec.split('|');
          if(!window.confirm('Delete this saved arrangement?')) return;
          state.data.substitutions[dt].splice(parseInt(idx,10), 1);
          if(!state.data.substitutions[dt].length) delete state.data.substitutions[dt];
          saveData(); paint();
        };
      });
    }

    paint();
    document.body.appendChild(overlay);
    function closeModal(){ state.subsOpen = false; overlay.remove(); render(); }
  }

  // ---------- export helpers ----------
  function cellText(slot){
    if(!slot || (!slot.subject && !slot.teacher && !slot.note)) return '';
    let s = slot.subject || '';
    if(slot.teacher) s += (s ? ' — ' : '') + slot.teacher;
    if(slot.room) s += ' (Rm ' + slot.room + ')';
    if(slot.note) s += ' [Sub-subject: ' + slot.note + ']';
    return s;
  }
  // HTML version of cellText for print output, so Sub-subject can be shown bold + colored
  // (Excel can't easily carry styling, so classAoa keeps using the plain-text cellText above).
  function cellHtml(slot){
    if(!slot || (!slot.subject && !slot.teacher && !slot.note)) return '';
    let s = escapeHtml(slot.subject || '');
    if(slot.teacher) s += (s ? ' — ' : '') + escapeHtml(slot.teacher);
    if(slot.room) s += ' (Rm ' + escapeHtml(slot.room) + ')';
    if(slot.note) s += '<br><span class="tt-subsubject">' + escapeHtml(slot.note) + '</span>';
    return s;
  }
  function safeSheetName(s){
    return String(s).replace(/[:\\\/\?\*\[\]]/g, '-').slice(0,31);
  }
  function signatureFooterRows(){
    if(!state.data.signature && !state.data.signatureName) return [];
    return [ [], ['Authorized by:', state.data.signatureName || 'Admin'], ['Date:', new Date().toLocaleDateString()] ];
  }

  function classAoa(id){
    const sec = state.data.sections[id];
    const header = ['Period','Time', ...DAYS];
    const rows = [ ['Timetable — '+displaySid(id)], [], header ];
    for(let p=0; p<PERIOD_COUNT; p++){
      const row = [state.data.periodNames[p], state.data.periodTimes[p]];
      DAYS.forEach(d => row.push(cellText(sec[d][p])));
      rows.push(row);
    }
    rows.push(...signatureFooterRows());
    return rows;
  }
  function classPrintHtml(id){
    const sec = state.data.sections[id];
    let html = '<h2>'+escapeHtml(displaySid(id))+'</h2><table class="print-table"><thead><tr><th>Period</th><th>Time</th>';
    DAYS.forEach(d => html += '<th class="tt-day">'+d+'</th>');
    html += '</tr></thead><tbody>';
    for(let p=0; p<PERIOD_COUNT; p++){
      html += '<tr><td>'+escapeHtml(state.data.periodNames[p])+'</td><td>'+escapeHtml(state.data.periodTimes[p])+'</td>';
      DAYS.forEach(d => { html += '<td>'+cellHtml(sec[d][p])+'</td>'; });
      html += '</tr>';
    }
    html += '</tbody></table><div class="page-break"></div>';
    return html;
  }
  function hexToRgb(hex){
    const h = hex.replace('#','');
    return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)];
  }
  // Same board as the on-screen Timetable view — subject-colored cells, bold day headers,
  // bold sub-subject box — so Print/Share look exactly like what's shown, day-wise, for
  // this one class/section.
  function colorfulClassBoardHtml(id){
    const sec = state.data.sections[id];
    const cinfo = getClassInfo(id);
    const conflicts = computeConflicts();
    let html = '<h2>'+escapeHtml(displaySid(id))+'</h2>';
    if(cinfo.classTeacher || cinfo.coClassTeacher || cinfo.room){
      html += '<p style="font-size:12px;color:#5B6B60">';
      const parts = [];
      if(cinfo.classTeacher) parts.push('<b>Class Teacher</b> '+escapeHtml(cinfo.classTeacher));
      if(cinfo.coClassTeacher) parts.push('<b>Co-Class Teacher</b> '+escapeHtml(cinfo.coClassTeacher));
      if(cinfo.room) parts.push('<b>Room</b> '+escapeHtml(cinfo.room));
      html += parts.join(' &nbsp;·&nbsp; ') + '</p>';
    }
    html += '<div class="board-wrap"><table class="board"><thead><tr><th>Period</th>';
    DAYS.forEach(d => { html += '<th class="day-head"><span class="tt-day">'+d+'</span></th>'; });
    html += '</tr></thead><tbody>';
    for(let p=0; p<PERIOD_COUNT; p++){
      html += '<tr><td class="period-cell"><div class="bell-tag"><div class="num">'+(p+1)+'</div><div class="period-name">'+escapeHtml(state.data.periodNames[p])+'</div></div>';
      html += '<div class="bell-time">'+escapeHtml(state.data.periodTimes[p])+'</div></td>';
      DAYS.forEach(day => {
        const slot = sec[day][p];
        const conflictKey = id+'|'+day+'-'+p;
        const hasConflict = !!conflicts[conflictKey];
        const color = subjColor(slot.subject);
        const filled = !!slot.subject || !!slot.teacher || !!slot.note;
        html += '<td class="slot"><div class="cell '+(filled?'filled':'empty')+(hasConflict?' conflict':'')+'"'
          + ' style="background:'+(filled?color.bg:'#FAFBF9')+';'+(filled?('border-left:3px solid '+color.line+';'):'')+'">';
        if(hasConflict) html += '<div class="conflict-dot">!</div>';
        if(filled){
          html += '<div class="subj">'+escapeHtml(slot.subject||'—')+'</div>';
          if(slot.note) html += '<div class="slot-note">'+escapeHtml(slot.note)+'</div>';
          if(slot.teacher) html += '<div class="teacher">'+escapeHtml(slot.teacher)+'</div>';
          if(slot.room) html += '<div class="room">Room '+escapeHtml(slot.room)+'</div>';
        }
        html += '</div></td>';
      });
      html += '</tr>';
    }
    html += '</tbody></table></div><div class="page-break"></div>';
    return html;
  }
  function printClassBoardColorful(id){
    document.getElementById('printArea').innerHTML = colorfulClassBoardHtml(id) + signatureBlockHtml();
    window.print();
  }
  function downloadClassBoardExcel(id){
    if(typeof XLSX === 'undefined'){ window.alert('The Excel export library did not load — check your connection and try again.'); return; }
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(classAoa(id));
    XLSX.utils.book_append_sheet(wb, ws, safeSheetName(displaySid(id)));

  async function shareClassBoardPdf(id){
    if(typeof window.jspdf === 'undefined'){ window.alert('The PDF library did not load — check your connection and try again.'); return; }
    const sec = state.data.sections[id];
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape' });
    const title = 'Timetable — ' + displaySid(id);
    doc.setFontSize(14);
    doc.text(title, 14, 14);

    const head = [['Period', ...DAYS]];
    const body = [];
    for(let p=0; p<PERIOD_COUNT; p++){
      const row = [state.data.periodNames[p] + '\n' + state.data.periodTimes[p]];
      DAYS.forEach(day => {
        const slot = sec[day][p];
        let text = slot.subject || '';
        if(slot.note) text += (text?'\n':'') + 'Sub-subject: ' + slot.note;
        if(slot.teacher) text += (text?'\n':'') + slot.teacher;
        if(slot.room) text += (text?'\n':'') + 'Rm ' + slot.room;
        row.push(text);
      });
      body.push(row);
    }

    doc.autoTable({
      head, body, startY: 20,
      styles: { fontSize: 8, cellPadding: 2, valign: 'middle' },
      headStyles: { fillColor: [201,168,105], textColor: 20 },
      columnStyles: { 0: { fontStyle: 'bold' } },
      didParseCell: (data) => {
        if(data.section !== 'body' || data.column.index === 0) return;
        const day = DAYS[data.column.index - 1];
        const slot = sec[day][data.row.index];
        if(slot && slot.subject){
          const color = subjColor(slot.subject);
          data.cell.styles.fillColor = hexToRgb(color.bg);
        }
      }
    });

    const blob = doc.output('blob');
    const fileName = 'timetable-'+safeSheetName(displaySid(id))+'.pdf';
    const file = new File([blob], fileName, { type: 'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try{ await navigator.share({ files: [file], title }); return; }
      catch(e){ return; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    window.alert('Sharing isn\'t supported in this browser, so the PDF was downloaded instead — you can share that file from your downloads.');
  }
  function teacherRows(target){
    const rows = [];
    allSectionIds().forEach(id => {
      const sec = state.data.sections[id];
      DAYS.forEach(day => sec[day].forEach((slot,p) => {
        const tokens = splitList(slot.teacher);
        if(!tokens.length) return;
        tokens.forEach(t => {
          if(target !== 'ALL' && t.toLowerCase() !== target.toLowerCase()) return;
          rows.push({ Teacher:t, Day:day, Period:state.data.periodNames[p], Time:state.data.periodTimes[p], Class:displaySid(id), Subject:slot.subject||'', Room:slot.room||'', 'Sub-subject':slot.note||'' });
        });
      }));
    });
    rows.sort((a,b) => a.Teacher.localeCompare(b.Teacher) || DAYS.indexOf(a.Day)-DAYS.indexOf(b.Day));
    return rows;
  }
  function subjectRows(target){
    const rows = [];
    allSectionIds().forEach(id => {
      const sec = state.data.sections[id];
      DAYS.forEach(day => sec[day].forEach((slot,p) => {
        const tokens = splitList(slot.subject);
        if(!tokens.length) return;
        tokens.forEach(s => {
          if(target !== 'ALL' && s.toLowerCase() !== target.toLowerCase()) return;
          rows.push({ Subject:s, Day:day, Period:state.data.periodNames[p], Time:state.data.periodTimes[p], Class:displaySid(id), Teacher:slot.teacher||'', Room:slot.room||'', 'Sub-subject':slot.note||'' });
        });
      }));
    });
    rows.sort((a,b) => a.Subject.localeCompare(b.Subject) || DAYS.indexOf(a.Day)-DAYS.indexOf(b.Day));
    return rows;
  }
  // Sub-subject-wise, for the whole week — groups every period by its Sub-subject value
  // (e.g. "Physics" under a "Science" period) rather than by the main Subject.
  function subSubjectRows(target){
    const rows = [];
    allSectionIds().forEach(id => {
      const sec = state.data.sections[id];
      DAYS.forEach(day => sec[day].forEach((slot,p) => {
        if(!slot.note) return;
        if(target !== 'ALL' && slot.note.toLowerCase() !== target.toLowerCase()) return;
        rows.push({ 'Sub-subject':slot.note, Day:day, Period:state.data.periodNames[p], Time:state.data.periodTimes[p], Class:displaySid(id), Subject:slot.subject||'', Teacher:slot.teacher||'', Room:slot.room||'' });
      }));
    });
    rows.sort((a,b) => a['Sub-subject'].localeCompare(b['Sub-subject']) || DAYS.indexOf(a.Day)-DAYS.indexOf(b.Day));
    return rows;
  }
  function teacherRowsByQuery(query){
    const q = (query || '').trim().toLowerCase();
    const rows = [];
    allSectionIds().forEach(id => {
      const sec = state.data.sections[id];
      DAYS.forEach(day => sec[day].forEach((slot,p) => {
        const t = (slot.teacher || '').trim();
        if(!t) return;
        if(q && !t.toLowerCase().includes(q)) return;
        rows.push({ Teacher:t, Day:day, Period:state.data.periodNames[p], Time:state.data.periodTimes[p], Class:displaySid(id), Subject:slot.subject||'', Room:slot.room||'', 'Sub-subject':slot.note||'' });
      }));
    });
    rows.sort((a,b) => a.Teacher.localeCompare(b.Teacher) || DAYS.indexOf(a.Day)-DAYS.indexOf(b.Day));
    return rows;
  }
  function printTeacherQuery(query){

  function downloadTeacherQueryExcel(query){

    XLSX.utils.book_append_sheet(wb, ws, 'Teacher schedule');
    XLSX.writeFile(wb, 'timetable-teacher-'+(query ? safeSheetName(query) : 'all')+'.xlsx');
  }

  // Same Period × Day grid the on-screen "Weekly grid" tab builds, reused so the shared
  // PDF matches exactly what's shown on screen.
  function teacherGridDataForShare(query){
    const q = (query||'').trim().toLowerCase();
    const rows = [];
    allSectionIds().forEach(id => {
      const sec = state.data.sections[id];
      DAYS.forEach(day => sec[day].forEach((slot,p) => {
        if((slot.teacher||'').toLowerCase().includes(q)){
          rows.push({ id, day, p, subject: slot.subject, room: slot.room, note: slot.note });
        }
      }));
    });
    const grid = {};
    DAYS.forEach(d => grid[d] = Array.from({length:PERIOD_COUNT}, () => []));
    rows.forEach(r => grid[r.day][r.p].push(r));
    return { rows, grid };
  }

    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;

  // Builds { nameMap, grid, rowKeys } used by both the on-screen All-teachers view and its exports.
  // grid[teacherKey][period][dayIndex] = [{id, subject, room}, ...]
  function buildAllTeachersGrid(){
    const nameMap = new Map();
    allTeachers().forEach(t => nameMap.set(t.toLowerCase(), t));
    const grid = {};
    allSectionIds().forEach(id => {
      const sec = state.data.sections[id];
      DAYS.forEach((day, di) => {
        sec[day].forEach((slot,p) => {
          splitList(slot.teacher).forEach(t => {
            const key = t.toLowerCase();
            if(!nameMap.has(key)) nameMap.set(key, t);
            if(!grid[key]) grid[key] = Array.from({length:PERIOD_COUNT}, () => Array.from({length:DAYS.length}, () => []));
            grid[key][p][di].push({ id, subject: slot.subject, room: slot.room, note: slot.note });
          });
        });
      });
    });
    nameMap.forEach((name, key) => { if(!grid[key]) grid[key] = Array.from({length:PERIOD_COUNT}, () => Array.from({length:DAYS.length}, () => [])); });
    const rowKeys = Array.from(nameMap.keys()).sort((a,b) => nameMap.get(a).localeCompare(nameMap.get(b)));
    return { nameMap, grid, rowKeys };
  }

  // Sums how many periods a teacher's grid row (from buildAllTeachersGrid) covers across the whole week.
  function teacherWeekTotal(teacherGridRow){
    let total = 0;
    teacherGridRow.forEach(periodDays => { periodDays.forEach(dayEntries => { total += dayEntries.length; }); });
    return total;
  }

  // Builds { grid, rowIds } used by both the on-screen All-classes view and its exports.
  // grid[sectionId][period][dayIndex] = [{subject, teacher, room}, ...] (0 or 1 entry per class)
  function buildAllClassesGrid(){
    const rowIds = allSectionIds();
    const grid = {};
    rowIds.forEach(id => {
      const sec = state.data.sections[id];
      grid[id] = Array.from({length:PERIOD_COUNT}, () => Array.from({length:DAYS.length}, () => []));
      DAYS.forEach((day, di) => {
        sec[day].forEach((slot,p) => {
          if(slot.subject || slot.teacher || slot.note){
            grid[id][p][di].push({ subject: slot.subject, teacher: slot.teacher, room: slot.room, note: slot.note });
          }
        });
      });
    });
    return { grid, rowIds };
  }

  // ---------- manage period times modal ----------
  function formatClock(totalMinutes){
    totalMinutes = ((totalMinutes % (24*60)) + 24*60) % (24*60);
    let h = Math.floor(totalMinutes/60);
    const m = totalMinutes%60;
    const suffix = h < 12 ? 'AM' : 'PM';
    h = h % 12; if(h === 0) h = 12;
    return h + ':' + String(m).padStart(2,'0') + ' ' + suffix;
  }
  function parseClockToMinutes(hhmm){
    // hhmm from <input type="time"> is 24hr "HH:MM"
    const [h,m] = hhmm.split(':').map(Number);
    return h*60 + m;
  }

    overlay.innerHTML = `
      <div class="modal">
        <h3>Manage period times</h3>
        <div class="sub">Shown to everyone across every section</div>

        <div class="auto-panel">
          <div class="auto-panel-title">Auto-fill from a duration template</div>
          <div class="auto-row">
            <div class="field" style="flex:1"><label>School starts at</label><input type="time" id="genStart" value="09:00"/></div>
            <div class="field" style="flex:1"><label>Minutes per period</label><input type="number" id="genDuration" value="40" min="5" max="180"/></div>
          </div>
          <div class="auto-row">
            <div class="field" style="flex:1"><label>Break</label><select id="genBreakAfter">${breakOptions}</select></div>
            <div class="field" style="flex:1"><label>Break length (min)</label><input type="number" id="genBreakLen" value="20" min="0" max="120"/></div>
          </div>
          <button class="btn btn-primary" id="genApply" style="width:100%">Generate ${PERIOD_COUNT} period times</button>
        </div>

        <div class="auto-panel-title" style="margin-top:16px">Fine-tune individually</div>
        ${fields}
        <div class="modal-actions">
          <button class="btn btn-ghost" id="tCancel">Cancel</button>
          <button class="btn btn-primary" id="tSave">Save times</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
    document.getElementById('tCancel').onclick = closeModal;

    document.getElementById('genApply').onclick = () => {
      const startVal = document.getElementById('genStart').value;
      const duration = parseInt(document.getElementById('genDuration').value, 10);
      const breakAfter = parseInt(document.getElementById('genBreakAfter').value, 10);
      const breakLen = parseInt(document.getElementById('genBreakLen').value, 10) || 0;
      if(!startVal || !duration || duration <= 0){
        window.alert('Enter a valid start time and period duration first.');
        return;
      }
      let cursor = parseClockToMinutes(startVal);
      for(let p=0; p<PERIOD_COUNT; p++){
        const label = formatClock(cursor);
        const input = overlay.querySelector('[data-timeinput="'+p+'"]');
        if(input) input.value = label;
        cursor += duration;
        if(breakAfter && (p+1) === breakAfter) cursor += breakLen;
      }
    };

    document.getElementById('tSave').onclick = () => {
      for(let p=0; p<PERIOD_COUNT; p++){
        const timeInput = overlay.querySelector('[data-timeinput="'+p+'"]');
        const nameInput = overlay.querySelector('[data-nameinput="'+p+'"]');
        const timeVal = (timeInput.value||'').trim();
        const nameVal = (nameInput.value||'').trim();
        if(timeVal) state.data.periodTimes[p] = timeVal;
        state.data.periodNames[p] = nameVal || ('Period ' + (p+1));
      }
      saveData(); closeModal();
    };
    function closeModal(){ state.managingTimes = false; overlay.remove(); render(); }
  }

  // ---------- manage classes modal ----------
  function renderManageModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';

    function body(){
      let html = '<h3>Manage classes &amp; class teachers</h3><div class="sub">Add or remove grades/sections, and assign a class teacher, co-class teacher, and room to each</div>';
      html += '<div class="auto-row" style="margin-bottom:12px">';
      html += '<button class="btn btn-ghost" id="mPrintDetails" style="flex:1">Print class &amp; teacher details</button>';
      html += '<button class="btn btn-primary" id="mExcelDetails" style="flex:1">Download Excel</button>';
      html += '</div>';
      html += '<datalist id="ctTeacherList">'+teacherOptions().map(t => '<option value="'+escapeHtml(t)+'">').join('')+'</datalist>';
      state.data.grades.forEach(g => {
        html += '<div class="manage-grade">';
        html += '<div class="manage-grade-head"><b>Grade '+escapeHtml(g)+'</b><button class="mini-btn" data-delgrade="'+escapeHtml(g)+'">Delete grade</button></div>';
        (state.data.sectionsByGrade[g]||[]).forEach(l => {
          const id = sid(g, l);
          const info = getClassInfo(id);
          html += '<div class="ct-row">';
          html += '<div class="ct-row-label">Sec '+escapeHtml(l)+'<span class="x" data-delsection="'+escapeHtml(g)+'|'+escapeHtml(l)+'" style="margin-left:4px">×</span></div>';
          html += '<input list="ctTeacherList" placeholder="Class teacher" data-ctfield="classTeacher|'+id+'" value="'+escapeHtml(info.classTeacher)+'"/>';
          html += '<input list="ctTeacherList" placeholder="Co-class teacher" data-ctfield="coClassTeacher|'+id+'" value="'+escapeHtml(info.coClassTeacher)+'"/>';
          html += '<input placeholder="Room" data-ctfield="room|'+id+'" value="'+escapeHtml(info.room)+'" style="max-width:70px"/>';
          html += '</div>';
        });
        html += '<div class="inline-add" style="margin-top:6px"><input placeholder="New section e.g. D" data-addsection="'+escapeHtml(g)+'" maxlength="12"/><button data-addsectionbtn="'+escapeHtml(g)+'">Add</button></div>';
        html += '</div>';
      });
      if(!state.data.grades.length) html += '<div class="empty-state">No grades yet. Add one below.</div>';
      html += '<div class="field" style="margin-top:10px"><label>Add a new grade</label>';
      html += '<div class="inline-add"><input placeholder="e.g. 6 or KG" id="newGradeInput" maxlength="20"/><button id="addGradeBtn">Add grade</button></div></div>';
      html += '<div class="modal-actions"><button class="btn btn-primary" id="mClose">Done</button></div>';
      return html;
    }

    function paint(){
      overlay.innerHTML = '<div class="modal" style="max-width:540px">' + body() + '</div>';
      overlay.querySelector('#mClose').onclick = closeModal;
      overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
      overlay.querySelector('#mPrintDetails').onclick = () => printStaffAndClassDetails();
      overlay.querySelector('#mExcelDetails').onclick = () => downloadStaffAndClassDetailsExcel();

      overlay.querySelectorAll('[data-ctfield]').forEach(inp => {
        inp.onchange = () => {
          const [field, id] = inp.dataset.ctfield.split('|');
          if(!state.data.classInfo) state.data.classInfo = {};
          if(!state.data.classInfo[id]) state.data.classInfo[id] = { classTeacher:'', coClassTeacher:'', room:'' };
          state.data.classInfo[id][field] = inp.value.trim();
          saveData();
        };
      });
      overlay.querySelectorAll('[data-delgrade]').forEach(el => {
        el.onclick = () => {
          const g = el.dataset.delgrade;
          if(!window.confirm('Delete Grade '+g+' and all its sections/timetables? This cannot be undone.')) return;
          state.data.grades = state.data.grades.filter(x => x !== g);
          (state.data.sectionsByGrade[g]||[]).forEach(l => {
            delete state.data.sections[sid(g,l)];
            if(state.data.classInfo) delete state.data.classInfo[sid(g,l)];
          });
          delete state.data.sectionsByGrade[g];
          saveData(); paint();
        };
      });
      overlay.querySelectorAll('[data-delsection]').forEach(el => {
        el.onclick = () => {
          const [g,l] = el.dataset.delsection.split('|');
          if(!window.confirm('Delete Section '+l+' from Grade '+g+' and its timetable?')) return;
          state.data.sectionsByGrade[g] = (state.data.sectionsByGrade[g]||[]).filter(x => x !== l);
          delete state.data.sections[sid(g,l)];
          if(state.data.classInfo) delete state.data.classInfo[sid(g,l)];
          saveData(); paint();
        };
      });
      overlay.querySelectorAll('[data-addsectionbtn]').forEach(el => {
        el.onclick = () => {
          const g = el.dataset.addsectionbtn;
          const input = overlay.querySelector('[data-addsection="'+g+'"]');
          const val = (input.value||'').trim().toUpperCase();
          if(!val) return;
          if(!state.data.sectionsByGrade[g]) state.data.sectionsByGrade[g] = [];
          if(state.data.sectionsByGrade[g].includes(val)){ window.alert('Section already exists.'); return; }
          state.data.sectionsByGrade[g].push(val);
          state.data.sections[sid(g,val)] = emptySection();
          saveData(); paint();
        };
      });
      const addGradeBtn = overlay.querySelector('#addGradeBtn');
      if(addGradeBtn) addGradeBtn.onclick = () => {
        const input = overlay.querySelector('#newGradeInput');
        const val = (input.value||'').trim();
        if(!val) return;
        if(state.data.grades.includes(val)){ window.alert('That grade already exists.'); return; }
        state.data.grades.push(val);
        state.data.sectionsByGrade[val] = [];
        saveData(); paint();
      };
    }

    paint();
    document.body.appendChild(overlay);
    function closeModal(){ state.managing = false; overlay.remove(); render(); }
  }

  loadAll();
})();
</script>
</body>
</html>
