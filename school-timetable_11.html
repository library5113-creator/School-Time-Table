<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bell &amp; Board — School Timetable</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg:#EEF1EE;
    --surface:#FFFFFF;
    --ink:#1E2A22;
    --ink-soft:#5B6B60;
    --ink-faint:#8B9A8F;
    --line:#DCE2DA;
    --gold:#E3A93B;
    --gold-soft:#FDF3E4;
    --coral:#E2604B;
    --coral-soft:#FDECEA;
    --green:#3E8E6E;
    --blue:#3B6FD1;
    --radius:10px;
    --shadow: 0 1px 2px rgba(30,42,34,0.06), 0 4px 14px rgba(30,42,34,0.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold); color:var(--ink); }

  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    background: radial-gradient(circle at 30% 20%, #2a3d30 0%, var(--ink) 55%, #16201a 100%);
  }
  .login-card{
    background:var(--surface); border-radius:20px; padding:32px 28px; width:100%; max-width:360px;
    box-shadow:0 24px 60px rgba(0,0,0,.35); text-align:center;
  }
  .app-icon-lg{
    width:64px; height:64px; margin:0 auto 16px; border-radius:20px;
    background:linear-gradient(135deg, var(--ink), #3E8E6E);
    display:flex; align-items:center; justify-content:center; box-shadow:0 10px 24px rgba(30,42,34,.35);
  }
  .app-icon-lg svg{ width:32px; height:32px; }
  .login-title{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; margin:0 0 2px; }
  .login-sub{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); margin-bottom:22px; }
  .login-card .field{ text-align:left; }
  .login-hint{ font-size:11px; color:var(--ink-faint); margin-top:14px; line-height:1.5; }

  .app{ max-width:1180px; margin:0 auto; padding:22px 20px 60px; }
  .app.login-mode{ max-width:none; padding:0; margin:0; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap; margin-bottom:18px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .bell{ width:30px; height:30px; flex:none; }
  .brand h1{
    font-family:'Space Grotesk', sans-serif; font-size:20px; font-weight:700;
    letter-spacing:-0.01em; margin:0;
  }
  .brand small{ display:block; font-size:11px; color:var(--ink-soft); font-weight:500; margin-top:-2px; }

  .admin-toggle{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pill-btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:8px 14px; border-radius:999px; font-family:'IBM Plex Sans',sans-serif;
    font-size:13px; font-weight:600; cursor:pointer; transition:all .15s ease;
  }
  .pill-btn:hover{ border-color:var(--ink-faint); }
  .pill-btn.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .pill-btn.danger{ color:var(--coral); border-color:var(--coral); background:var(--coral-soft); }

  .nav-row{ display:flex; gap:8px; margin-bottom:14px; }
  .mode-tab{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px;
    padding:9px 16px; border-radius:8px 8px 0 0; cursor:pointer; color:var(--ink-soft);
    border-bottom:2px solid transparent;
  }
  .mode-tab.active{ color:var(--ink); border-bottom:2px solid var(--gold); }

  .grade-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; align-items:center; }
  .grade-chip{
    font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:600;
    padding:7px 13px; border-radius:8px; background:var(--surface); border:1px solid var(--line);
    cursor:pointer; color:var(--ink-soft);
  }
  .grade-chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .section-row{ display:flex; gap:6px; margin-bottom:18px; align-items:center; flex-wrap:wrap; }
  .section-chip{
    font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600;
    padding:6px 16px; border-radius:999px; border:1.5px solid var(--gold);
    color:var(--ink); background:var(--gold-soft); cursor:pointer;
  }
  .section-chip.active{ background:var(--gold); }

  .stats{ display:flex; gap:22px; margin-bottom:18px; flex-wrap:wrap; }
  .stat{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); }
  .stat b{ color:var(--ink); font-size:14px; }

  .class-info-band{
    display:flex; gap:18px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft);
    background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:9px 14px; margin-bottom:12px;
  }
  .class-info-band b{ color:var(--ink); font-family:'Space Grotesk',sans-serif; font-weight:600; margin-right:5px; }

  .board-wrap{
    background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:6px; overflow-x:auto;
  }
  table.board{ border-collapse:separate; border-spacing:0; width:100%; min-width:760px; }
  table.board th{
    font-family:'Space Grotesk',sans-serif; font-size:12.5px; font-weight:600;
    text-align:left; padding:10px 10px; color:var(--ink-soft); border-bottom:1px solid var(--line);
  }
  table.board th.day-head{ text-align:center; }
  .day-head-inner{ display:flex; align-items:center; justify-content:center; gap:5px; }
  .copy-icon{
    cursor:pointer; width:18px; height:18px; border-radius:5px; display:flex; align-items:center;
    justify-content:center; font-size:11px; color:var(--ink-faint); border:1px solid var(--line);
    background:var(--surface);
  }
  .copy-icon:hover{ color:var(--ink); border-color:var(--ink-faint); }

  .period-cell{ padding:10px 8px; vertical-align:top; border-bottom:1px solid var(--line); width:70px; }
  .bell-tag{ display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; }
  .bell-tag .num{
    width:22px; height:22px; border-radius:50%; background:var(--ink); color:#fff;
    font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .period-name{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px; }
  .bell-time{
    font-size:10.5px; color:var(--ink-faint); margin-top:3px; margin-left:28px; cursor:default;
    border-bottom:1px dashed transparent;
  }
  .bell-time.editable{ cursor:pointer; }
  .bell-time.editable:hover{ color:var(--ink-soft); border-bottom-color:var(--ink-faint); }

  td.slot{ padding:5px; border-bottom:1px solid var(--line); vertical-align:top; }
  .cell{
    min-height:56px; border-radius:8px; padding:7px 9px; cursor:default;
    border:1.5px solid var(--line); background:#FAFBF9; transition:box-shadow .15s ease;
    position:relative;
  }
  .cell.filled{ border-color:transparent; }
  .cell.editable{ cursor:pointer; }
  .cell.editable:hover{ box-shadow:0 0 0 2px var(--ink-faint) inset; }
  .cell .subj{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12.5px; line-height:1.25; }
  .cell .slot-note{ font-size:10px; font-weight:700; color:var(--green); background:rgba(62,142,110,0.09); border:1px dashed rgba(62,142,110,0.35); border-radius:4px; padding:2px 5px; margin-top:3px; line-height:1.3; white-space:normal; word-break:break-word; }
  .tt-day{ font-weight:700; color:var(--blue); }
  .tt-subsubject{ font-weight:700; color:var(--green); }
  .cell .teacher{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-top:3px; }
  .cell .room{ font-size:10px; color:var(--ink-faint); margin-top:1px; }
  .cell.empty::after{ content:'+'; color:var(--ink-faint); font-size:15px; }
  .cell.conflict{ border:1.5px dashed var(--coral); }
  .conflict-dot{
    position:absolute; top:-6px; right:-6px; width:16px; height:16px; border-radius:50%;
    background:var(--coral); color:#fff; font-size:10px; font-weight:700; display:flex;
    align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.25);
  }

  .warn-banner{
    background:var(--coral-soft); border:1.5px solid var(--coral); border-radius:10px;
    padding:12px 16px; margin-bottom:16px;
  }
  .warn-banner-head{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13.5px; color:var(--coral); margin-bottom:4px; }
  .warn-list{ margin:0; padding-left:18px; }
  .warn-list li{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink); margin-bottom:2px; }
  .warn-more{ font-size:11px; color:var(--coral); margin-top:4px; font-weight:600; }

  .legend{ margin-top:14px; font-size:11.5px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .legend .conflict-swatch{ width:12px; height:12px; border-radius:3px; border:1.5px dashed var(--coral); display:inline-block; }

  .teacher-search{ margin-bottom:16px; }
  .teacher-search input{
    width:100%; max-width:340px; padding:10px 14px; border-radius:8px; border:1px solid var(--line);
    font-family:'IBM Plex Sans',sans-serif; font-size:14px; background:var(--surface);
  }
  .teacher-grid-title{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; margin:18px 0 8px; }
  .empty-state{
    background:var(--surface); border-radius:var(--radius); padding:34px 20px; text-align:center;
    color:var(--ink-soft); box-shadow:var(--shadow);
  }

  .overlay{
    position:fixed; inset:0; background:rgba(30,42,34,.45); display:flex; align-items:center;
    justify-content:center; z-index:50; padding:16px;
  }
  .modal{
    background:var(--surface); border-radius:14px; padding:22px; width:100%; max-width:380px;
    box-shadow:0 20px 50px rgba(0,0,0,.25); max-height:86vh; overflow-y:auto;
  }
  .modal-fullscreen{
    max-width:none; width:100%; height:100%; max-height:none; border-radius:0;
    margin:0; box-sizing:border-box;
  }
  .overlay.overlay-fullscreen{ padding:0; align-items:stretch; justify-content:stretch; }
  .subs-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; border-bottom:1px solid var(--line); padding-bottom:10px; }
  .subs-tab{
    padding:7px 12px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;
    color:var(--ink-soft); background:var(--bg);
  }
  .subs-tab.active{ background:var(--ink); color:#fff; }
  .modal h3{ font-family:'Space Grotesk',sans-serif; margin:0 0 3px; font-size:16px; }
  .modal .sub{ font-size:12px; color:var(--ink-soft); margin-bottom:16px; font-family:'IBM Plex Mono',monospace; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; }
  .field input{
    width:100%; padding:9px 11px; border-radius:7px; border:1px solid var(--line); font-size:13.5px;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .field input:focus{ outline:2px solid var(--gold); outline-offset:0; border-color:transparent; }
  .modal-actions{ display:flex; gap:8px; margin-top:16px; }
  .btn{
    flex:1; padding:10px 12px; border-radius:8px; border:none; font-weight:600; font-size:13px;
    cursor:pointer; font-family:'IBM Plex Sans',sans-serif;
  }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-ghost{ background:var(--bg); color:var(--ink-soft); }
  .btn-clear{ background:var(--coral-soft); color:var(--coral); }
  .conflict-note{
    background:var(--coral-soft); color:var(--coral); font-size:11.5px; padding:8px 10px;
    border-radius:7px; margin-top:10px; font-family:'IBM Plex Mono',monospace;
  }
  .loading{ text-align:center; padding:60px 0; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; }

  .period-row{ display:flex; gap:10px; align-items:flex-start; }

  .auto-panel{
    background:var(--gold-soft); border:1.5px solid var(--gold); border-radius:10px;
    padding:12px 14px; margin-bottom:6px;
  }
  .auto-panel-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; margin-bottom:8px; }
  .auto-row{ display:flex; gap:10px; }
  .auto-panel select{
    width:100%; padding:9px 11px; border-radius:7px; border:1px solid var(--line); font-size:13px;
    font-family:'IBM Plex Sans',sans-serif; background:var(--surface);
  }
  .auto-panel input[type="time"], .auto-panel input[type="number"]{
    width:100%; padding:9px 11px; border-radius:7px; border:1px solid var(--line); font-size:13px;
    font-family:'IBM Plex Sans',sans-serif; background:var(--surface);
  }

  .chip-picker{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; max-height:100px; overflow-y:auto; }
  .chip-toggle{
    font-size:11px; padding:4px 9px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); cursor:pointer; color:var(--ink-soft); font-family:'IBM Plex Sans',sans-serif;
  }
  .chip-toggle.on{ background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:600; }

  .sub-hint{ font-size:10.5px; color:var(--coral); margin-top:4px; font-family:'IBM Plex Mono',monospace; min-height:12px; }
  .period-row input[type="text"]{
    width:100%; padding:8px 10px; border-radius:7px; border:1px solid var(--line); font-size:13px;
    font-family:'IBM Plex Sans',sans-serif;
  }

  .check-row{ display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13.5px; }
  .check-row input{ width:16px; height:16px; }

  .date-group{ border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .date-group-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; font-family:'Space Grotesk',sans-serif; font-size:13px; flex-wrap:wrap; }
  .date-group-actions{ display:flex; gap:6px; }
  .mini-btn-neutral{ background:var(--bg); color:var(--ink-soft); }

  .ct-row{ display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .ct-row-label{ width:64px; font-size:11.5px; font-weight:600; flex:none; color:var(--ink-soft); display:flex; align-items:center; gap:2px; }
  .save-indicator{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .save-indicator-bad{ color:#b3261e; font-weight:700; }
  .grid-total-row td{ border-top:2px solid var(--ink-soft); background:var(--paper-alt, #f5f2ea); }
  .ct-row input{
    flex:1; padding:7px 9px; border-radius:6px; border:1px solid var(--line); font-size:12.5px;
    font-family:'IBM Plex Sans',sans-serif; min-width:0;
  }

  .bulk-row{ display:flex; gap:6px; margin:6px 0 10px; flex-wrap:wrap; }

  .manage-grade{ border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  .manage-grade-head{ display:flex; align-items:center; justify-content:between; gap:8px; margin-bottom:8px; }
  .manage-grade-head b{ font-family:'Space Grotesk',sans-serif; font-size:14px; flex:1; }
  .mini-btn{
    border:none; background:var(--coral-soft); color:var(--coral); font-size:11px; font-weight:600;
    padding:5px 9px; border-radius:6px; cursor:pointer; display:inline-block;
  }
  .import-label{ margin-top:6px; }
  .section-list{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .section-tag{
    display:flex; align-items:center; gap:5px; background:var(--gold-soft); border:1px solid var(--gold);
    padding:4px 6px 4px 10px; border-radius:999px; font-size:12px; font-weight:600;
  }
  .section-tag .x{ cursor:pointer; color:var(--coral); font-weight:700; padding:0 3px; }
  .inline-add{ display:flex; gap:6px; }
  .inline-add input{ flex:1; padding:7px 9px; border-radius:6px; border:1px solid var(--line); font-size:12.5px; }
  .inline-add button{
    border:none; background:var(--ink); color:#fff; padding:7px 12px; border-radius:6px; font-size:12px;
    font-weight:600; cursor:pointer;
  }

  .export-tabs{ display:flex; gap:6px; margin-bottom:14px; }
  .export-tab{
    flex:1; text-align:center; padding:8px 6px; border-radius:8px; background:var(--bg);
    font-size:12px; font-weight:600; cursor:pointer; color:var(--ink-soft); font-family:'Space Grotesk',sans-serif;
  }
  .export-tab.active{ background:var(--ink); color:#fff; }

  .print-table{ width:100%; border-collapse:collapse; margin-bottom:20px; font-family:'IBM Plex Sans',sans-serif; font-size:12px; }
  .print-table th, .print-table td{ border:1px solid var(--line); padding:6px 8px; text-align:left; }
  .print-table th{ background:var(--bg); font-weight:600; }
  .preview-box{
    max-height:340px; overflow-y:auto; overflow-x:auto; border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    margin-top:6px; background:var(--bg);
  }
  .preview-box h2{ font-family:'Space Grotesk',sans-serif; font-size:14px; margin:10px 0 6px; }
  .preview-box h2:first-child{ margin-top:0; }

  .sig-preview{ height:44px; max-width:160px; object-fit:contain; border:1px solid var(--line); border-radius:6px; background:#fff; padding:4px; }
  .signature-block{ margin-top:26px; display:inline-block; text-align:center; }
  .signature-block .sig-img{ height:56px; max-width:200px; object-fit:contain; display:block; margin:0 auto 4px; }
  .signature-block .sig-line{ width:180px; border-top:1px solid #333; margin:2px auto 4px; }
  .signature-block .sig-label{ font-size:12px; font-weight:600; }
  .signature-block .sig-date{ font-size:10.5px; color:var(--ink-soft); }

  #printArea{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #printArea{ display:block; position:absolute; left:0; top:0; width:100%; padding:16px; }
    #printArea h2{ font-family:Arial, sans-serif; font-size:16px; margin:18px 0 8px; }
    .print-table{ font-family:Arial, sans-serif; font-size:11px; }
    .print-table th, .print-table td{ border:1px solid #999; }
    .page-break{ page-break-after:always; }
    .signature-block{ page-break-inside:avoid; }
  }

  @media (max-width:640px){
    .brand h1{ font-size:17px; }
    table.board{ min-width:660px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">loading timetable…</div>
</div>
<div id="printArea"></div>

<script>
(function(){
  const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat'];
  const PERIOD_COUNT = 8;
  const DEFAULT_TIMES = ['9:00','9:40','10:20','11:10','11:50','12:30','1:30','2:10'];
  const DEFAULT_PIN = '1234';
  const DEFAULT_VIEWER_PIN = '0000';
  const SEP = '::';

  const PALETTE = [
    {bg:'#FDF3E4', line:'#E3A93B'},
    {bg:'#E9F2ED', line:'#3E8E6E'},
    {bg:'#FDECEA', line:'#E2604B'},
    {bg:'#EAF0FB', line:'#4C6FA5'},
    {bg:'#F3ECFB', line:'#8B5FBF'},
    {bg:'#FEF6E0', line:'#D9A441'},
    {bg:'#E8F6F6', line:'#3D9C9C'},
    {bg:'#FBEEF3', line:'#C15C82'},
    {bg:'#F0F4E8', line:'#7A9A3D'},
    {bg:'#EFEDE7', line:'#8A7B65'}
  ];
  function subjColor(subject){
    if(!subject) return {bg:'#FAFBF9', line:'#DCE2DA'};
    let h = 0;
    for(let i=0;i<subject.length;i++) h = (h*31 + subject.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  const DOE_DELHI_SUBJECTS = [
    'English','Hindi','Sanskrit','Mathematics','Science','Social Science',
    'Computer Science','Information Technology','Informatics Practices',
    'Physical Education','Art Education','Work Education',
    'Happiness Curriculum','Deshbhakti Curriculum','Neev','Science of Living','Rashtraniti','Entrepreneurship Mindset Curriculum (EMC)',
    'Physics','Chemistry','Biology',
    'Accountancy','Business Studies','Economics',
    'History','Political Science','Geography','Sociology','Psychology','Home Science','Painting','Legal Studies','Entrepreneurship',
    'Hindi Elective','English Elective'
  ];
  function sid(grade, letter){ return grade + SEP + letter; }
  function getClassInfo(id){
    const info = (state.data.classInfo && state.data.classInfo[id]) || {};
    return { classTeacher: info.classTeacher || '', coClassTeacher: info.coClassTeacher || '', room: info.room || '' };
  }
  function getTeacherInfo(name){
    if(!state.data.teacherInfo) state.data.teacherInfo = {};

  // Turns [0,1,2,3,4] into "Mon-Fri", [0,2,4] into "Mon, Wed, Fri", [0,1,3,4] into "Mon-Tue, Thu-Fri"
  function compressDayRanges(dayIdx){
    if(!dayIdx.length) return '';
    const sorted = [...dayIdx].sort((a,b) => a-b);
    const parts = [];
    let start = sorted[0], prev = sorted[0];
    for(let i=1; i<=sorted.length; i++){
      const cur = sorted[i];
      if(cur === prev+1){ prev = cur; continue; }
      parts.push(start === prev ? DAYS[start] : DAYS[start]+'-'+DAYS[prev]);
      if(i < sorted.length){ start = cur; prev = cur; }
    }
    return parts.join(', ');
  }

  // dayEntries: array (one per weekday) of arrays of {id, subject, room} for one teacher/period.
  // Groups days that have the exact same class/subject (and any conflicts) into single lines
  // with a compressed day range, e.g. "6A · English  —  Mon-Fri".
  function groupPeriodByDayRange(dayEntries){
    const bySignature = new Map();
    dayEntries.forEach((entries, di) => {
      if(!entries || !entries.length) return;
      const sig = entries.map(e => (e.subject||'')+'@'+(e.id||'')+'@'+(e.teacher||'')+'@'+(e.room||'')+'@'+(e.note||'')).sort().join('|');
      if(!bySignature.has(sig)) bySignature.set(sig, { entries, days: [] });
      bySignature.get(sig).days.push(di);
    });
    return Array.from(bySignature.values()).map(g => ({
      entries: g.entries,
      conflict: g.entries.length > 1,
      range: compressDayRanges(g.days)
    })).sort((a,b) => a.entries[0].subject.localeCompare(b.entries[0].subject));
  }

  // ---------- storage adapter ----------
  // window.storage only exists while this file is open inside Claude's own chat window.
  // localStorage keeps the app working on one device/browser everywhere else.
  // If a Supabase project is connected (App settings → Cloud sync), that becomes the
  // primary source so every device/browser sees the same live data — localStorage and
  // window.storage still act as an offline cache/fallback underneath it.
  const LS_PREFIX = 'bnb_';
  const SUPABASE_CONFIG_KEY = 'bnb_supabase_config';
  const SUPABASE_TABLE = 'app_storage';

  function getSupabaseConfig(){
    try{
      const raw = localStorage.getItem(SUPABASE_CONFIG_KEY);
      if(!raw) return null;
      const cfg = JSON.parse(raw);
      if(cfg && cfg.url && cfg.anonKey) return cfg;
      return null;
    }catch(e){ return null; }
  }
  function setSupabaseConfig(url, anonKey){
    try{
      localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify({ url: url.replace(/\/+$/,''), anonKey }));
      return true;
    }catch(e){ return false; }
  }
  function clearSupabaseConfig(){
    try{ localStorage.removeItem(SUPABASE_CONFIG_KEY); }catch(e){ /* ignore */ }
  }
  async function supabaseGet(key){
    const cfg = getSupabaseConfig();
    if(!cfg) return undefined;
    try{
      const res = await fetch(cfg.url+'/rest/v1/'+SUPABASE_TABLE+'?key=eq.'+encodeURIComponent(key)+'&select=value', {
        headers: { apikey: cfg.anonKey, Authorization: 'Bearer '+cfg.anonKey }
      });
      if(!res.ok) return undefined;
      const rows = await res.json();
      return rows.length ? rows[0].value : undefined;
    }catch(e){ return undefined; }
  }
  async function supabaseSet(key, value){
    const cfg = getSupabaseConfig();
    if(!cfg) return false;
    try{
      const res = await fetch(cfg.url+'/rest/v1/'+SUPABASE_TABLE, {
        method: 'POST',
        headers: {
          apikey: cfg.anonKey,
          Authorization: 'Bearer '+cfg.anonKey,
          'Content-Type': 'application/json',
          Prefer: 'resolution=merge-duplicates,return=minimal'
        },
        body: JSON.stringify({ key, value, updated_at: new Date().toISOString() })
      });
      return res.ok;
    }catch(e){ return false; }
  }
  // Used by the "Connect & test" button in App settings — writes then reads back a
  // throwaway key so we can confirm the URL/key/table/policy are all actually working.
  async function testSupabaseConnection(url, anonKey){
    const tempKey = '__connection_test__';
    try{
      const setRes = await fetch(url.replace(/\/+$/,'')+'/rest/v1/'+SUPABASE_TABLE, {
        method: 'POST',
        headers: {
          apikey: anonKey, Authorization: 'Bearer '+anonKey,
          'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal'
        },
        body: JSON.stringify({ key: tempKey, value: 'ok', updated_at: new Date().toISOString() })
      });
      if(!setRes.ok) return { ok:false, message: 'Could not write to the table (HTTP '+setRes.status+'). Check the table name, URL, and anon key.' };
      const getRes = await fetch(url.replace(/\/+$/,'')+'/rest/v1/'+SUPABASE_TABLE+'?key=eq.'+tempKey+'&select=value', {
        headers: { apikey: anonKey, Authorization: 'Bearer '+anonKey }
      });
      if(!getRes.ok) return { ok:false, message: 'Could write but not read back (HTTP '+getRes.status+'). Check your Row Level Security policy allows SELECT.' };
      const rows = await getRes.json();
      if(!rows.length) return { ok:false, message: 'Write succeeded but nothing came back on read — check your RLS policy.' };
      return { ok:true, message: 'Connected successfully.' };
    }catch(e){
      return { ok:false, message: 'Could not reach that URL — check it\'s correct and that you\'re online.' };
    }
  }

  async function supabaseAuthSignUp(email, password){
    const cfg = getSupabaseConfig();
    if(!cfg) return { ok:false, message:'Cloud sync isn\'t connected yet — an admin needs to set that up in App settings first.' };
    try{
      const res = await fetch(cfg.url+'/auth/v1/signup', {
        method: 'POST',
        headers: { apikey: cfg.anonKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if(!res.ok) return { ok:false, message: data.msg || data.error_description || data.error || 'Could not create that account.' };
      if(!data.access_token) return { ok:false, message: 'Account created — check your email to confirm it, then log in.' };
      return { ok:true, data };
    }catch(e){ return { ok:false, message: 'Could not reach Supabase — check your connection.' }; }
  }
  async function supabaseAuthSignIn(email, password){
    const cfg = getSupabaseConfig();
    if(!cfg) return { ok:false, message:'Cloud sync isn\'t connected yet — an admin needs to set that up in App settings first.' };
    try{
      const res = await fetch(cfg.url+'/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: { apikey: cfg.anonKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if(!res.ok) return { ok:false, message: data.msg || data.error_description || data.error || 'Incorrect email or password.' };
      return { ok:true, data };
    }catch(e){ return { ok:false, message: 'Could not reach Supabase — check your connection.' }; }

  const storageAdapter = {
    async get(key){
      const cfg = getSupabaseConfig();
      if(cfg){
        const v = await supabaseGet(key);
        if(typeof v !== 'undefined'){
          try{ localStorage.setItem(LS_PREFIX + key, v); }catch(e){ /* ignore */ }
          return v;
        }
        // Supabase configured but unreachable/empty this time — fall through to local cache
      }
      if(typeof window.storage !== 'undefined' && window.storage){
        try{
          const r = await window.storage.get(key, true);
          if(r && typeof r.value !== 'undefined') return r.value;
        }catch(e){ /* fall through to localStorage */ }
      }
      try{
        const v = localStorage.getItem(LS_PREFIX + key);
        return v === null ? undefined : v;
      }catch(e){ return undefined; }
    },
    async set(key, value){
      let ok = false;
      const cfg = getSupabaseConfig();
      if(cfg){
        const sOk = await supabaseSet(key, value);
        if(sOk) ok = true;
        state.cloudSyncOk = sOk;
      }
      if(typeof window.storage !== 'undefined' && window.storage){
        try{ await window.storage.set(key, value, true); ok = true; }catch(e){ /* ignore */ }
      }
      try{ localStorage.setItem(LS_PREFIX + key, value); ok = true; }catch(e){ /* ignore */ }
      return ok;
    }
  };

  // When Supabase is connected, quietly re-check for changes from other devices every
  // 20s (only while logged in and no unsaved modal is open) so everyone stays in sync
  // without needing to refresh the page.
  let cloudPollTimer = null;
  function startCloudSyncPolling(){
    if(cloudPollTimer) clearInterval(cloudPollTimer);
    cloudPollTimer = setInterval(async () => {
      if(!getSupabaseConfig() || !state.loggedIn) return;
      const anyModalOpen = document.querySelector('.overlay');
      if(anyModalOpen) return; // don't yank the screen out from under an in-progress edit
      const v = await supabaseGet('tt-data-v2');
      if(typeof v === 'undefined') return;
      if(v !== JSON.stringify(state.data)){
        try{
          state.data = JSON.parse(v);
          localStorage.setItem(LS_PREFIX + 'tt-data-v2', v);
          render();
        }catch(e){ /* ignore malformed remote data */ }
      }
    }, 20000);
  }
  async function saveData(){
    const ok = await storageAdapter.set('tt-data-v2', JSON.stringify(state.data));
    state.lastSavedAt = ok ? Date.now() : state.lastSavedAt;
    state.lastSaveOk = ok;
    updateSaveIndicator();
  }
  function updateSaveIndicator(){
    const el = document.getElementById('saveIndicator');
    if(!el) return;
    if(!state.lastSaveOk){
      el.textContent = '⚠ Save failed — download a backup now';
      el.className = 'save-indicator save-indicator-bad';
      return;
    }
    if(!state.lastSavedAt){ el.textContent = ''; return; }
    const d = new Date(state.lastSavedAt);
    const hh = d.getHours().toString().padStart(2,'0');
    const mm = d.getMinutes().toString().padStart(2,'0');
    const cloudOn = !!getSupabaseConfig();
    if(cloudOn && state.cloudSyncOk === false){
      el.textContent = '⚠ Saved on this device only ' + hh + ':' + mm + ' — cloud sync failed';
      el.className = 'save-indicator save-indicator-bad';
    } else if(cloudOn){
      el.textContent = '☁ Synced ' + hh + ':' + mm;
      el.className = 'save-indicator';
    } else {
      el.textContent = 'Saved on this device ' + hh + ':' + mm;
      el.className = 'save-indicator';
    }
  }

  function allSectionIds(){
    const ids = [];
    state.data.grades.forEach(g => (state.data.sectionsByGrade[g]||[]).forEach(l => ids.push(sid(g,l))));
    return ids;
  }

  function computeConflicts(){
    const map = {};
    allSectionIds().forEach(id => {
      const sec = state.data.sections[id];
      if(!sec) return;
      DAYS.forEach(day => {
        sec[day].forEach((slot, p) => {
          splitList(slot.teacher).forEach(t => {
            const tl = t.toLowerCase();
            const key = day + '-' + p;
            if(!map[key]) map[key] = {};
            if(!map[key][tl]) map[key][tl] = [];
            map[key][tl].push(id);
          });
        });
      });
    });
    const conflictSet = {};
    Object.keys(map).forEach(key => {
      Object.values(map[key]).forEach(ids => {
        if(ids.length > 1){
          ids.forEach(id => { conflictSet[id+'|'+key] = ids.filter(x => x !== id).map(displaySid); });
        }
      });
    });
    return conflictSet;
  }
  function displaySid(id){ return id.split(SEP).join('-'); }

  function describeClashes(){
    const map = {};
    allSectionIds().forEach(id => {
      const sec = state.data.sections[id];
      DAYS.forEach(day => {
        sec[day].forEach((slot,p) => {
          splitList(slot.teacher).forEach(t => {
            const key = day+'-'+p+'-'+t.toLowerCase();
            if(!map[key]) map[key] = {teacher:t, day, p, ids:[]};
            map[key].ids.push(id);
          });
        });
      });
    });
    const out = [];
    Object.values(map).forEach(entry => {
      if(entry.ids.length > 1){
        out.push(entry.teacher+' — '+entry.day+' P'+(entry.p+1)+' — clashes across '+entry.ids.map(displaySid).join(', '));
      }
    });
    return out;
  }

  function allSubjectsUsed(){
    const set = new Set();
    allSectionIds().forEach(id => {
      const sec = state.data.sections[id];
      DAYS.forEach(day => sec[day].forEach(slot => { splitList(slot.subject).forEach(s => set.add(s)); }));
    });
    return Array.from(set);
  }
  function allSubSubjectsUsed(){
    const set = new Set();
    allSectionIds().forEach(id => {
      const sec = state.data.sections[id];
      DAYS.forEach(day => sec[day].forEach(slot => { if(slot.note) set.add(slot.note); }));
    });
    return Array.from(set).sort((a,b) => a.localeCompare(b));
  }
  function subjectOptions(){
    const set = new Set([...(state.data.subjects||[]), ...allSubjectsUsed()]);
    return Array.from(set).sort();
  }
  function teacherOptions(){
    // Dedupe case-insensitively — the same teacher can end up typed with different
    // capitalization in different cells (e.g. "Ashif Shekh" vs "ashif shekh"), and a
    // plain Set treats those as two different names. Master-list casing wins when both exist.
    const seen = new Map();
    (state.data.teachers||[]).forEach(t => {
      const name = t.trim();
      const key = name.toLowerCase();
      if(key) seen.set(key, name);
    });
    allTeachers().forEach(t => {
      const name = t.trim();
      const key = name.toLowerCase();
      if(key && !seen.has(key)) seen.set(key, name);
    });
    return Array.from(seen.values()).sort((a,b) => a.localeCompare(b));
  }

  function allTeachers(){
    // Dedupe case-insensitively so "Ashif Shekh" typed in one cell and "ashif shekh" typed
    // in another don't count as two different teachers. First-seen casing wins.
    const seen = new Map();
    allSectionIds().forEach(id => {
      const sec = state.data.sections[id];
      DAYS.forEach(day => sec[day].forEach(slot => {
        splitList(slot.teacher).forEach(t => {
          const name = t.trim();
          const key = name.toLowerCase();
          if(key && !seen.has(key)) seen.set(key, name);
        });
      }));
    });
    return Array.from(seen.values()).sort((a,b) => a.localeCompare(b));
  }

      body += '<div class="field"><label>Access code</label><input id="loginPin" type="password" inputmode="numeric" placeholder="Enter your PIN"/></div>';
      if(state.loginError) body += '<div class="conflict-note">'+escapeHtml(state.loginError)+'</div>';
      body += '<button class="btn btn-primary" id="loginSubmit" style="width:100%;margin-top:10px">Enter</button>';
      body += '<div class="login-hint">Admins and viewers use different access codes — ask your admin if you don\'t have one.</div>';
    }

    app.innerHTML = '<div class="login-wrap"><div class="login-card">'+body+'</div></div>';

    document.querySelectorAll('[data-loginmethod]').forEach(el => {
      el.onclick = () => { state.loginMethod = el.dataset.loginmethod; state.loginError = ''; renderLoginScreen(); };
    });
    document.querySelectorAll('[data-emailmode]').forEach(el => {
      el.onclick = () => { state.emailAuthMode = el.dataset.emailmode; state.loginError = ''; renderLoginScreen(); };
    });

    if(method === 'email' && cloudOn){
      const emailField = document.getElementById('authEmail');
      const passField = document.getElementById('authPassword');
      emailField.focus();
      const submit = async () => {
        const email = emailField.value.trim();
        const password = passField.value;
        state.authEmailDraft = email;
        if(!email || !password){ state.loginError = 'Enter both your email and password.'; renderLoginScreen(); return; }
        if(emailMode === 'signup' && password.length < 6){ state.loginError = 'Password must be at least 6 characters.'; renderLoginScreen(); return; }

        const submitBtn = document.getElementById('authSubmit');
        submitBtn.textContent = 'Please wait…'; submitBtn.disabled = true;
        const result = emailMode === 'signup' ? await supabaseAuthSignUp(email, password) : await supabaseAuthSignIn(email, password);
        if(!result.ok){
          state.loginError = result.message;
          renderLoginScreen();
          return;
        }
        setAuthSession({ access_token: result.data.access_token, email });
        if(emailMode === 'signup' && (!state.data.adminEmails || !state.data.adminEmails.length)){
          addAdminEmail(email); // first account ever created becomes admin
        }
        state.isAdmin = isAdminEmail(email);
        state.loginName = email;
        state.loggedIn = true;
        state.loginError = '';
        render();
      };
      document.getElementById('authSubmit').onclick = submit;
      passField.onkeydown = (e) => { if(e.key === 'Enter') submit(); };
    } else {
      const pinField = document.getElementById('loginPin');
      const nameField = document.getElementById('loginName');
      pinField.focus();
      document.getElementById('loginSubmit').onclick = submitPinLogin;
      pinField.onkeydown = (e) => { if(e.key === 'Enter') submitPinLogin(); };
      nameField.onkeydown = (e) => { if(e.key === 'Enter') submitPinLogin(); };

      function submitPinLogin(){
        state.loginName = nameField.value.trim();
        const code = pinField.value.trim();
        if(!code){ state.loginError = 'Enter an access code.'; renderLoginScreen(); return; }
        if(code === state.pin){ state.isAdmin = true; state.loggedIn = true; state.loginError = ''; render(); return; }
        if(code === state.viewerPin){ state.isAdmin = false; state.loggedIn = true; state.loginError = ''; render(); return; }
        state.loginError = 'Incorrect access code.';
        renderLoginScreen();
      }
    }
  }

  function render(){
    app.classList.remove('login-mode');
    if(!state.data){ app.innerHTML = '<div class="loading">loading timetable…</div>'; return; }

    const grades = state.data.grades;
    if(!grades.includes(state.grade)) state.grade = grades[0] || null;
    const secList = state.grade ? (state.data.sectionsByGrade[state.grade]||[]) : [];
    if(!secList.includes(state.section)) state.section = secList[0] || null;

    const conflicts = computeConflicts();
    const teacherCount = allTeachers().length;
    const allIds = allSectionIds();
    const filledCount = allIds.reduce((n,id) => {
      const sec = state.data.sections[id];
      DAYS.forEach(d => sec[d].forEach(s => { if(s.subject) n++; }));
      return n;
    }, 0);
    const conflictCount = Object.keys(conflicts).length;

    let html = '';
    html += '<div class="topbar">';
    html += '<div class="brand">' + bellSvg() + '<div><h1>'+escapeHtml(state.data.title || 'Bell & Board')+'</h1><small>Timetable · '+grades.length+' grade(s) · '+allIds.length+' section(s)</small><div id="saveIndicator" class="save-indicator"></div></div></div>';
    html += '<div class="admin-toggle">';
    if(state.loginName) html += '<span class="stat" style="align-self:center">Hi, '+escapeHtml(state.loginName)+'</span>';
    html += '<button class="pill-btn" id="btnExport">Export / Print</button>';
    if(state.isAdmin){
      html += '<button class="pill-btn on" id="btnAdmin">Admin mode: ON</button>';
      html += '<button class="pill-btn" id="btnManage">Manage classes</button>';
      html += '<button class="pill-btn" id="btnPeople">Manage teachers &amp; subjects</button>';
      html += '<button class="pill-btn" id="btnTimes">Manage period times</button>';
      html += '<button class="pill-btn" id="btnSubs">Absent teacher</button>';
      html += '<button class="pill-btn" id="btnAppSettings">App settings</button>';
      html += '<button class="pill-btn" id="btnBackup">Backup &amp; restore</button>';
      html += '<button class="pill-btn danger" id="btnReset">Reset all</button>';
    } else {
      html += '<button class="pill-btn" id="btnAdmin">Enter admin mode</button>';
    }
    html += '<button class="pill-btn" id="btnLogout">Log out</button>';
    html += '</div></div>';

    html += '<div class="nav-row">';
    html += '<div class="mode-tab ' + (state.mode==='board'?'active':'') + '" id="tabBoard">Timetable</div>';
    html += '<div class="mode-tab ' + (state.mode==='teacher'?'active':'') + '" id="tabTeacher">Teacher view</div>';
    html += '<div class="mode-tab ' + (state.mode==='allteachers'?'active':'') + '" id="tabAllTeachers">All teachers</div>';
    html += '<div class="mode-tab ' + (state.mode==='allclasses'?'active':'') + '" id="tabAllClasses">All classes</div>';
    html += '</div>';

    if(conflictCount){
      const clashList = describeClashes();
      html += '<div class="warn-banner"><div class="warn-banner-head">⚠ '+clashList.length+' teacher clash'+(clashList.length===1?'':'es')+' found across the timetable</div>';
      html += '<ul class="warn-list">';
      clashList.slice(0,6).forEach(c => { html += '<li>'+escapeHtml(c)+'</li>'; });
      html += '</ul>';
      if(clashList.length>6) html += '<div class="warn-more">+ '+(clashList.length-6)+' more — check Teacher view to find them all</div>';
      html += '</div>';
    }

    if(state.mode === 'board'){
      html += '<div class="grade-row">';
      grades.forEach(g => {
        html += '<div class="grade-chip ' + (g===state.grade?'active':'') + '" data-grade="'+escapeHtml(g)+'">Grade '+escapeHtml(g)+'</div>';
      });
      if(!grades.length) html += '<span class="stat">No classes yet — use Manage classes to add one.</span>';
      html += '</div>';

      if(state.grade){
        html += '<div class="section-row">';
        secList.forEach(l => {
          html += '<div class="section-chip ' + (l===state.section?'active':'') + '" data-section="'+escapeHtml(l)+'">Section '+escapeHtml(l)+'</div>';
        });
        if(!secList.length) html += '<span class="stat">No sections in this grade yet.</span>';
        html += '</div>';
      }

      html += '<div class="stats">';
      html += '<div class="stat"><b>'+teacherCount+'</b> teachers scheduled</div>';
      html += '<div class="stat"><b>'+filledCount+'</b> / '+(allIds.length*DAYS.length*PERIOD_COUNT)+' periods filled</div>';
      html += '<div class="stat" style="color:' + (conflictCount? 'var(--coral)':'var(--ink-soft)') + '"><b style="color:' + (conflictCount?'var(--coral)':'var(--ink)') + '">'+conflictCount+'</b> conflicting slots</div>';
      html += '</div>';

      if(state.grade && state.section){
        const curId = sid(state.grade, state.section);
        const sec = state.data.sections[curId];
        const cinfo = getClassInfo(curId);

        if(cinfo.classTeacher || cinfo.coClassTeacher || cinfo.room){
          html += '<div class="class-info-band">';
          if(cinfo.classTeacher) html += '<span><b>Class Teacher</b> '+escapeHtml(cinfo.classTeacher)+'</span>';
          if(cinfo.coClassTeacher) html += '<span><b>Co-Class Teacher</b> '+escapeHtml(cinfo.coClassTeacher)+'</span>';
          if(cinfo.room) html += '<span><b>Room</b> '+escapeHtml(cinfo.room)+'</span>';
          html += '</div>';
        } else if(state.isAdmin){
          html += '<div class="class-info-band" style="color:var(--ink-faint)">No class teacher, co-class teacher, or room set yet — use "Class teachers" above to add one.</div>';
        }

        html += '<div class="board-wrap"><table class="board"><thead><tr><th>Period</th>';
        DAYS.forEach(d => {
          html += '<th class="day-head"><div class="day-head-inner"><span class="tt-day">'+d+'</span>';
          if(state.isAdmin) html += '<span class="copy-icon" data-copyday="'+d+'" title="Copy '+d+' to other days">⧉</span>';
          html += '</div></th>';
        });
        html += '</tr></thead><tbody>';

        for(let p=0; p<PERIOD_COUNT; p++){
          html += '<tr>';
          html += '<td class="period-cell"><div class="bell-tag"><div class="num">'+(p+1)+'</div><div class="period-name">'+escapeHtml(state.data.periodNames[p])+'</div>';
          if(state.isAdmin) html += '<span class="copy-icon" data-copyperiod="'+p+'" title="Copy this period across days">⧉</span>';
          html += '</div>';
          html += '<div class="bell-time ' + (state.isAdmin?'editable':'') + '" data-ptime="'+p+'">'+escapeHtml(state.data.periodTimes[p])+'</div></td>';
          DAYS.forEach(day => {
            const slot = sec[day][p];
            const conflictKey = curId+'|'+day+'-'+p;
            const hasConflict = !!conflicts[conflictKey];
            const color = subjColor(slot.subject);
            const filled = !!slot.subject || !!slot.teacher || !!slot.note;
            html += '<td class="slot">';
            html += '<div class="cell ' + (filled?'filled':'empty') + ' ' + (state.isAdmin?'editable':'') + ' ' + (hasConflict?'conflict':'') + '"';
            html += ' style="background:'+(filled?color.bg:'#FAFBF9')+';' + (filled?('border-left:3px solid '+color.line+';'):'') + '"';
            html += ' data-day="'+day+'" data-p="'+p+'">';
            if(hasConflict) html += '<div class="conflict-dot" title="Teacher also teaches '+conflicts[conflictKey].join(', ')+' at this time">!</div>';
            if(filled){
              html += '<div class="subj">'+escapeHtml(slot.subject||'—')+'</div>';
              if(slot.note) html += '<div class="slot-note">'+escapeHtml(slot.note)+'</div>';
              if(slot.teacher) html += '<div class="teacher">'+escapeHtml(slot.teacher)+'</div>';
              if(slot.room) html += '<div class="room">Room '+escapeHtml(slot.room)+'</div>';
            }
            html += '</div></td>';
          });
          html += '</tr>';
        }
        html += '</tbody></table></div>';

        html += '<div class="auto-row" style="margin-top:10px;max-width:560px">';
        html += '<button class="btn btn-ghost" id="cbPrint" style="flex:1">Print / Save PDF</button>';
        html += '<button class="btn btn-primary" id="cbExcel" style="flex:1">Download Excel</button>';
        html += '<button class="btn btn-primary" id="cbSharePdf" style="flex:1">Share PDF</button>';
        html += '</div>';

        if(conflictCount) html += '<div class="legend"><span class="conflict-swatch"></span> dashed outline = teacher double-booked at that period</div>';
        if(state.isAdmin) html += '<div class="legend">Tip: click ⧉ next to a day to copy that whole day onto other days, or ⧉ next to a period to copy that period across days or onto another period.</div>';
        if(!state.isAdmin) html += '<div class="legend">Viewing only — an admin can edit this timetable.</div>';
      } else {
        html += '<div class="empty-state">Pick or create a grade and section to see its timetable.</div>';
      }

    } else if(state.mode === 'teacher'){
      html += '<div class="teacher-search"><input id="teacherInput" placeholder="Type a teacher&#39;s name…" value="'+escapeHtml(state.teacherQuery)+'" list="teacherList"/>';
      html += '<datalist id="teacherList">';
      allTeachers().forEach(t => html += '<option value="'+escapeHtml(t)+'"></option>');
      html += '</datalist></div>';

      const q = state.teacherQuery.trim().toLowerCase();
      if(!q){
        html += '<div class="empty-state">Search a teacher to see their full weekly schedule across every section, and instantly spot any clashes.</div>';
      } else {
        const rows = [];
        allIds.forEach(id => {
          const sec = state.data.sections[id];
          DAYS.forEach(day => sec[day].forEach((slot,p) => {
            if((slot.teacher||'').toLowerCase().includes(q)){
              rows.push({id, day, p, subject:slot.subject, room:slot.room, note:slot.note});
            }
          }));
        });
        if(!rows.length){
          html += '<div class="empty-state">No periods found for "'+escapeHtml(state.teacherQuery)+'".</div>';
        } else {
          html += '<div class="teacher-grid-title">'+rows.length+' period(s) found</div>';
          html += '<div class="export-tabs" style="max-width:280px">';
          html += '<div class="export-tab '+(state.teacherViewMode!=='grid'?'active':'')+'" data-tvmode="list">List</div>';
          html += '<div class="export-tab '+(state.teacherViewMode==='grid'?'active':'')+'" data-tvmode="grid">Weekly grid</div>';
          html += '</div>';

          const dayOrder = d => DAYS.indexOf(d);

          if(state.teacherViewMode === 'grid'){
            const grid = {};
            DAYS.forEach(d => grid[d] = Array.from({length:PERIOD_COUNT}, () => []));
            rows.forEach(r => grid[r.day][r.p].push(r));
            html += '<div class="teacher-grid-title" style="margin-top:2px">Total periods this week: <b>'+rows.length+'</b></div>';
            html += '<div class="board-wrap"><table class="board"><thead><tr><th>Period</th>';
            DAYS.forEach(d => html += '<th class="day-head"><span class="tt-day">'+d+'</span></th>');
            html += '</tr></thead><tbody>';
            for(let p=0; p<PERIOD_COUNT; p++){
              html += '<tr><td class="period-cell"><div class="bell-tag"><div class="num">'+(p+1)+'</div><div class="period-name">'+escapeHtml(state.data.periodNames[p])+'</div></div>';
              html += '<div class="bell-time">'+escapeHtml(state.data.periodTimes[p])+'</div></td>';
              DAYS.forEach(day => {
                const entries = grid[day][p];
                const filled = entries.length > 0;
                const color = filled ? subjColor(entries[0].subject) : null;
                html += '<td class="slot"><div class="cell '+(filled?'filled':'empty')+'"'
                  + (filled ? ' style="background:'+color.bg+';border-left:3px solid '+color.line+';"' : '') + '>';
                entries.forEach(e => {
                  const ck = e.id+'|'+e.day+'-'+e.p;
                  const conflictHere = !!conflicts[ck];
                  html += '<div class="subj"'+(conflictHere?' style="color:var(--coral)"':'')+'>'+escapeHtml(e.subject||'—')+'</div>';
                  if(e.note) html += '<div class="slot-note">'+escapeHtml(e.note)+'</div>';
                  html += '<div class="teacher">'+escapeHtml(displaySid(e.id))+'</div>';
                  if(e.room) html += '<div class="room">Room '+escapeHtml(e.room)+'</div>';
                });
                html += '</div></td>';
              });
              html += '</tr>';
            }
            html += '<tr class="grid-total-row"><td class="period-cell"><b>Total</b></td>';
            DAYS.forEach(day => {
              const dayTotal = grid[day].reduce((sum, entries) => sum + entries.length, 0);
              html += '<td class="slot" style="text-align:center"><b>'+dayTotal+'</b></td>';
            });
            html += '</tr>';
            html += '</tbody></table></div>';
            html += '<div class="auto-row" style="margin-top:10px;max-width:560px">';
            html += '<button class="btn btn-ghost" id="tvPrint" style="flex:1">Print / Save PDF</button>';
            html += '<button class="btn btn-primary" id="tvExcel" style="flex:1">Download Excel</button>';
            html += '<button class="btn btn-primary" id="tvSharePdf" style="flex:1">Share PDF</button>';
            html += '</div>';
          } else {
            html += '<div class="board-wrap"><table class="board"><thead><tr><th>Day</th><th>Period</th><th>Section</th><th>Subject</th><th>Room</th><th>Sub-subject</th></tr></thead><tbody>';
            rows.sort((a,b) => dayOrder(a.day)-dayOrder(b.day) || a.p-b.p);
            rows.forEach(r => {
              const ck = r.id+'|'+r.day+'-'+r.p;
              const conflictHere = !!conflicts[ck];
              html += '<tr' + (conflictHere?' style="background:var(--coral-soft)"':'') + '>';
              html += '<td class="period-cell"><span class="tt-day">'+r.day+'</span></td>';
              html += '<td class="period-cell">'+escapeHtml(state.data.periodNames[r.p])+' · '+escapeHtml(state.data.periodTimes[r.p])+'</td>';
              html += '<td class="period-cell"><b>'+escapeHtml(displaySid(r.id))+'</b></td>';
              html += '<td class="period-cell">'+escapeHtml(r.subject||'—')+'</td>';
              html += '<td class="period-cell">'+escapeHtml(r.room||'—')+'</td>';
              html += '<td class="period-cell">'+(r.note ? '<span class="tt-subsubject">'+escapeHtml(r.note)+'</span>' : '—')+'</td>';
              html += '</tr>';
            });
            html += '</tbody></table></div>';
          }
        }
      }

    } else if(state.mode === 'allteachers'){
      // ---- All teachers combined view: ONE sheet, header row = periods, rows = teachers.
      // Each cell shows the class/subject plus which day(s) it happens on (e.g. "Mon-Fri").
      const { nameMap, grid, rowKeys: allRowKeys } = buildAllTeachersGrid();
      const typeFilter = state.allTeachersTypeFilter || 'All';
      const rowKeys = allRowKeys.filter(key => {
        if(typeFilter === 'All') return true;
        return getTeacherInfo(nameMap.get(key)).type === typeFilter;
      });

      html += '<div class="export-tabs" style="max-width:300px;margin-bottom:8px">';
      ['All','Permanent','Guest'].forEach(t => {
        html += '<div class="export-tab '+(typeFilter===t?'active':'')+'" data-attype="'+t+'">'+t+'</div>';
      });
      html += '</div>';

      if(!rowKeys.length){
        html += '<div class="empty-state">'+(allRowKeys.length ? 'No '+typeFilter.toLowerCase()+' teachers found — set each teacher\'s type in Manage teachers &amp; subjects.' : 'No teachers added yet — add some in Manage teachers &amp; subjects.')+'</div>';
      } else {
        html += '<div class="teacher-grid-title" style="margin-top:2px">Whole week, one sheet · '+rowKeys.length+' '+(typeFilter==='All'?'':typeFilter.toLowerCase()+' ')+'teacher(s)</div>';
        html += '<div class="auto-row" style="margin:8px 0 10px;max-width:420px">';
        html += '<button class="btn btn-ghost" id="atPrint" style="flex:1">Print / Save PDF</button>';
        html += '<button class="btn btn-primary" id="atExcel" style="flex:1">Download Excel</button>';
        html += '</div>';
        html += '<div class="board-wrap"><table class="board"><thead><tr><th>Teacher</th>';
        for(let p=0; p<PERIOD_COUNT; p++){
          html += '<th class="day-head"><div class="day-head-inner">P'+(p+1)+'</div><div class="bell-time">'+escapeHtml(state.data.periodTimes[p])+'</div></th>';
        }
        html += '<th class="day-head"><div class="day-head-inner">Total</div></th>';
        html += '</tr></thead><tbody>';
        rowKeys.forEach(key => {
          const name = nameMap.get(key);
          html += '<tr><td class="period-cell"><b>'+escapeHtml(name)+'</b></td>';
          for(let p=0; p<PERIOD_COUNT; p++){
            const groups = groupPeriodByDayRange(grid[key][p]);
            const filled = groups.length > 0;
            const conflictHere = groups.some(g => g.conflict);
            const color = filled ? subjColor(groups[0].entries[0].subject) : null;
            html += '<td class="slot"><div class="cell '+(filled?'filled':'empty')+(conflictHere?' conflict':'')+'"'
              + (filled ? ' style="background:'+color.bg+';border-left:3px solid '+color.line+';"' : '') + '>';
            if(conflictHere) html += '<div class="conflict-dot" title="Teaching more than one class this period on at least one day">!</div>';
            groups.forEach(g => {
              const label = g.entries.map(e => (e.subject||'—')+' · '+displaySid(e.id)+(e.room?' (Rm '+e.room+')':'')).join(' + ');
              const noteText = g.entries.map(e => e.note).filter(Boolean).join(' + ');
              html += '<div class="subj"'+(g.conflict?' style="color:var(--coral)"':'')+'>'+escapeHtml(label)+'</div>';
              if(noteText) html += '<div class="slot-note">'+escapeHtml(noteText)+'</div>';
              html += '<div class="tt-day" style="margin-top:3px;font-size:10.5px">'+escapeHtml(g.range)+'</div>';
            });
            html += '</div></td>';
          }
          html += '<td class="period-cell" style="text-align:center"><b>'+teacherWeekTotal(grid[key])+'</b></td>';
          html += '</tr>';
        });
        html += '</tbody></table></div>';
      }
    } else {
      // ---- All classes combined view: ONE sheet, header row = periods, rows = classes.
      // Each cell shows the subject/teacher plus which day(s) it happens on (e.g. "Mon-Fri").
      const { grid, rowIds } = buildAllClassesGrid();

      if(!rowIds.length){
        html += '<div class="empty-state">No classes added yet — add some in Manage classes.</div>';
      } else {
        html += '<div class="teacher-grid-title" style="margin-top:2px">Whole week, one sheet · '+rowIds.length+' class(es)</div>';
        html += '<div class="auto-row" style="margin:8px 0 10px;max-width:420px">';
        html += '<button class="btn btn-ghost" id="acPrint" style="flex:1">Print / Save PDF</button>';
        html += '<button class="btn btn-primary" id="acExcel" style="flex:1">Download Excel</button>';
        html += '</div>';
        html += '<div class="board-wrap"><table class="board"><thead><tr><th>Class</th>';
        for(let p=0; p<PERIOD_COUNT; p++){
          html += '<th class="day-head"><div class="day-head-inner">P'+(p+1)+'</div><div class="bell-time">'+escapeHtml(state.data.periodTimes[p])+'</div></th>';
        }
        html += '</tr></thead><tbody>';
        rowIds.forEach(id => {
          html += '<tr><td class="period-cell"><b>'+escapeHtml(displaySid(id))+'</b></td>';
          for(let p=0; p<PERIOD_COUNT; p++){
            const groups = groupPeriodByDayRange(grid[id][p]);
            const filled = groups.length > 0;
            const color = filled ? subjColor(groups[0].entries[0].subject) : null;
            html += '<td class="slot"><div class="cell '+(filled?'filled':'empty')+'"'
              + (filled ? ' style="background:'+color.bg+';border-left:3px solid '+color.line+';"' : '') + '>';
            groups.forEach(g => {
              const label = g.entries.map(e => (e.subject||'—')+(e.teacher?' · '+e.teacher:'')+(e.room?' (Rm '+e.room+')':'')).join(' + ');
              const noteText = g.entries.map(e => e.note).filter(Boolean).join(' + ');
              html += '<div class="subj">'+escapeHtml(label)+'</div>';
              if(noteText) html += '<div class="slot-note">'+escapeHtml(noteText)+'</div>';
              html += '<div class="tt-day" style="margin-top:3px;font-size:10.5px">'+escapeHtml(g.range)+'</div>';
            });
            html += '</div></td>';
          }
          html += '</tr>';
        });
        html += '</tbody></table></div>';
      }
    }

    app.innerHTML = html;
    document.title = (state.data.title || 'Bell & Board') + ' — School Timetable';
    bindEvents();
    updateSaveIndicator();
    if(state.editing) renderEditModal();
    if(state.copyingDay) renderCopyModal();
    if(state.copyingPeriod !== null) renderCopyPeriodModal();
    if(state.managing) renderManageModal();
    if(state.managingTimes) renderTimesModal();
    if(state.managingPeople) renderPeopleModal();
    if(state.exportOpen) renderExportModal();
    if(state.subsOpen) renderSubsModal();
    if(state.appSettingsOpen) renderAppSettingsModal();
    if(state.backupOpen) renderBackupModal();
  }

  function bindEvents(){
    const btnAdmin = document.getElementById('btnAdmin');
    if(btnAdmin) btnAdmin.onclick = onAdminToggle;
    const btnLogout = document.getElementById('btnLogout');
    if(btnLogout) btnLogout.onclick = onLogout;

  // ---------- cell edit modal ----------
  function renderEditModal(){
    const { id, day, p } = state.editing;
    const slot = state.data.sections[id][day][p];
    const conflicts = computeConflicts();
    const ck = id+'|'+day+'-'+p;
    const hasConflict = !!conflicts[ck];

    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    const subjOpts = subjectOptions().map(s => '<option value="'+escapeHtml(s)+'">').join('');
    const teachOpts = teacherOptions().map(t => '<option value="'+escapeHtml(t)+'">').join('');
    const subjChips = subjectOptions().map(s => {
      const on = splitList(slot.subject).some(v => v.toLowerCase() === s.toLowerCase());
      return '<span class="chip-toggle '+(on?'on':'')+'" data-chiptoggle="fSubject" data-val="'+escapeHtml(s)+'">'+escapeHtml(s)+'</span>';
    }).join('');
    const teachChips = teacherOptions().map(t => {
      const on = splitList(slot.teacher).some(v => v.toLowerCase() === t.toLowerCase());
      return '<span class="chip-toggle '+(on?'on':'')+'" data-chiptoggle="fTeacher" data-val="'+escapeHtml(t)+'">'+escapeHtml(t)+'</span>';
    }).join('');
    overlay.innerHTML = `
      <div class="modal">
        <h3>${escapeHtml(displaySid(id))} · ${day}</h3>
        <div class="sub">${escapeHtml(state.data.periodNames[p])} · ${escapeHtml(state.data.periodTimes[p])}</div>
        <div class="field"><label>Subject(s) — pick multiple, or type comma-separated</label><input id="fSubject" list="subjDatalist" value="${escapeHtml(slot.subject||'')}" placeholder="e.g. Mathematics, Physics"/><datalist id="subjDatalist">${subjOpts}</datalist>
        <div class="chip-picker">${subjChips || '<span class="stat">No subjects added yet</span>'}</div></div>
        <div class="field"><label>Teacher(s) — pick multiple, or type comma-separated</label><input id="fTeacher" list="teachDatalist" value="${escapeHtml(slot.teacher||'')}" placeholder="e.g. Mr. Rao, Mrs. Singh"/><datalist id="teachDatalist">${teachOpts}</datalist>
        <div class="chip-picker">${teachChips || '<span class="stat">No teachers added yet</span>'}</div></div>
        <div class="field"><label>Room</label><input id="fRoom" value="${escapeHtml(slot.room||'')}" placeholder="e.g. 204"/></div>
        <div class="field"><label>Sub-subject (optional) — shows just below the subject in the timetable</label><input id="fNote" value="${escapeHtml(slot.note||'')}" placeholder="e.g. Physics"/></div>
        ${hasConflict ? `<div class="conflict-note">This teacher already teaches ${conflicts[ck].join(', ')} at this exact period.</div>` : ''}
        <div class="modal-actions">
          <button class="btn btn-ghost" id="mCancel">Cancel</button>
          <button class="btn btn-clear" id="mClear">Clear</button>
          <button class="btn btn-primary" id="mSave">Save</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    document.getElementById('fSubject').focus();
    document.getElementById('mCancel').onclick = closeModal;
    overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
    overlay.querySelectorAll('[data-chiptoggle]').forEach(chip => {
      chip.onclick = () => {
        const field = document.getElementById(chip.dataset.chiptoggle);
        const val = chip.dataset.val;
        const tokens = splitList(field.value);
        const idx = tokens.findIndex(t => t.toLowerCase() === val.toLowerCase());
        if(idx >= 0) tokens.splice(idx, 1); else tokens.push(val);
        field.value = tokens.join(', ');
        chip.classList.toggle('on');
      };
    });
    document.getElementById('mClear').onclick = () => {
      state.data.sections[id][day][p] = {subject:'', teacher:'', room:'', note:''};
      saveData(); closeModal();
    };
    document.getElementById('mSave').onclick = () => {
      const subject = document.getElementById('fSubject').value.trim();
      const teacher = document.getElementById('fTeacher').value.trim();
      const room = document.getElementById('fRoom').value.trim();
      const note = document.getElementById('fNote').value.trim();

      if(teacher){
        const myTeachers = splitList(teacher);
        const clashWith = [];
        allSectionIds().forEach(otherId => {
          if(otherId === id) return;
          const otherSlot = state.data.sections[otherId][day][p];
          const otherTeachers = splitList(otherSlot.teacher);
          const shared = myTeachers.filter(t => otherTeachers.some(o => o.toLowerCase() === t.toLowerCase()));
          if(shared.length){
            clashWith.push(displaySid(otherId) + ' (' + shared.join(', ') + ')');
          }
        });
        if(clashWith.length){
          const proceed = window.confirm(
            'Warning: this clashes with ' + clashWith.join(', ') +
            ' during ' + day + ' Period ' + (p+1) + '.\n\nSave anyway?'
          );
          if(!proceed) return;
        }
      }

      state.data.sections[id][day][p] = { subject, teacher, room, note };
      saveData(); closeModal();
    };
    function closeModal(){ state.editing = null; overlay.remove(); render(); }
  }

  function renderCopyPeriodModal(){
    const p = state.copyingPeriod;

    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    let mode = 'days'; // 'days' | 'periods'

      body += '<div class="export-tabs">';

        const sourceSlot = state.data.sections[curId][sourceDay][p];
        let dayOptions = DAYS.map(d => '<option value="'+d+'" '+(d===sourceDay?'selected':'')+'>'+d+'</option>').join('');
        let checks = DAYS.filter(d => d !== sourceDay)
          .map(d => `<label class="check-row"><input type="checkbox" value="${d}"> ${d}</label>`).join('');
        const preview = sourceSlot.subject || sourceSlot.teacher
          ? escapeHtml(sourceSlot.subject||'—') + (sourceSlot.teacher ? ' · '+escapeHtml(sourceSlot.teacher) : '')
          : '<span style="color:var(--ink-faint)">empty</span>';

        body += `
          <div class="sub">${escapeHtml(displaySid(curId))} · ${escapeHtml(state.data.periodNames[p])} — copies this same period onto other days</div>
          <div class="field"><label>Copy from</label><select id="pSourceDay">${dayOptions}</select></div>
          <div class="field" style="font-size:12px;color:var(--ink-soft)">Currently: ${preview}</div>
          <div class="field"><label>Copy to which day(s)? This overwrites that period on those days.</label>${checks}</div>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="pCancel">Cancel</button>
            <button class="btn btn-primary" id="pApply">Copy</button>
          </div>`;
      } else {
        let periodChecks = '';
        for(let tp=0; tp<PERIOD_COUNT; tp++){
          if(tp === p) continue;
          periodChecks += `<label class="check-row"><input type="checkbox" value="${tp}"> P${tp+1} — ${escapeHtml(state.data.periodNames[tp])}</label>`;
        }
        body += `
          <div class="sub">${escapeHtml(displaySid(curId))} — copies Period ${p+1}'s whole week (all days) onto another period</div>
          <div class="field"><label>Copy Period ${p+1} to which period(s)? This overwrites those periods, all days, for this section.</label>${periodChecks}</div>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="pCancel">Cancel</button>
            <button class="btn btn-primary" id="pApplyPeriod">Copy</button>
          </div>`;
      }

      overlay.innerHTML = '<div class="modal">' + body + '</div>';
      overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
      overlay.querySelector('#pCancel').onclick = closeModal;
      overlay.querySelectorAll('[data-pmode]').forEach(el => {
        el.onclick = () => { mode = el.dataset.pmode; paint(sourceDay); };
      });

      if(mode === 'days'){
        overlay.querySelector('#pSourceDay').onchange = (e) => paint(e.target.value);
        overlay.querySelector('#pApply').onclick = () => {
          const targets = Array.from(overlay.querySelectorAll('input[type=checkbox]:checked')).map(i => i.value);
          if(!targets.length){ closeModal(); return; }
          const source = state.data.sections[curId][sourceDay][p];
          targets.forEach(d => {
            state.data.sections[curId][d][p] = { ...source };
          });
          saveData(); closeModal();
        };
      } else {
        overlay.querySelector('#pApplyPeriod').onclick = () => {
          const targets = Array.from(overlay.querySelectorAll('input[type=checkbox]:checked')).map(i => parseInt(i.value,10));
          if(!targets.length){ closeModal(); return; }
          targets.forEach(tp => {

            });
          });
          saveData(); closeModal();
        };
      }
    }
    paint();
    document.body.appendChild(overlay);
    function closeModal(){ state.copyingPeriod = null; overlay.remove(); render(); }
  }

  // ---------- manage teachers & subjects modal ----------
  function importNamesFromFile(file, callback){
    if(typeof XLSX === 'undefined'){ callback(null, 'no-xlsx'); return; }
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const reader = new FileReader();
    reader.onerror = () => callback(null, 'read-error');
    reader.onload = (e) => {
      try{
        const wb = ext === 'csv'
          ? XLSX.read(e.target.result, { type:'string' })
          : XLSX.read(new Uint8Array(e.target.result), { type:'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
        const skipWords = ['subject','subjects','teacher','teachers','name','names'];
        const values = [];
        rows.forEach(row => {
          if(!row) return;
          row.forEach(cell => {
            const v = String(cell || '').trim();
            if(!v) return;
            if(skipWords.includes(v.toLowerCase())) return;
            values.push(v);
          });
        });
        callback(values, null);
      }catch(err){ callback(null, 'parse-error'); }
    };
    if(ext === 'csv') reader.readAsText(file);
    else reader.readAsArrayBuffer(file);
  }

  // ---------- backup & restore ----------
  function downloadBackup(){
    const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'timetable-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
  function restoreBackupFile(file){
    const reader = new FileReader();
    reader.onload = (e) => {
      let parsed;
      try{ parsed = JSON.parse(e.target.result); }
      catch(err){ window.alert('Could not read that file — make sure it\'s a backup downloaded from this app.'); return; }
      if(!parsed || !parsed.grades || !parsed.sections){
        window.alert('This doesn\'t look like a valid backup file.');
        return;
      }
      if(!window.confirm('This replaces ALL current data — every class, section, timetable, teacher, subject and setting — with the contents of this backup. This cannot be undone. Continue?')) return;

      if(!parsed.periodNames || parsed.periodNames.length !== PERIOD_COUNT) parsed.periodNames = defaultPeriodNames();
      if(!parsed.periodTimes || parsed.periodTimes.length !== PERIOD_COUNT) parsed.periodTimes = DEFAULT_TIMES.slice();
      if(!Array.isArray(parsed.subjects)) parsed.subjects = DOE_DELHI_SUBJECTS.slice();
      if(!Array.isArray(parsed.teachers)) parsed.teachers = [];
      if(!parsed.settings) parsed.settings = { maxPeriodsPerDay: 6, maxContinuousPeriods: 3 };
      if(!parsed.substitutions) parsed.substitutions = {};
      if(!parsed.title) parsed.title = 'Bell & Board';
      if(!parsed.classInfo) parsed.classInfo = {};
      if(parsed.signature === undefined) parsed.signature = null;
      if(!parsed.signatureName) parsed.signatureName = '';

      state.data = parsed;
      state.grade = state.data.grades[0] || null;
      state.section = state.grade ? (state.data.sectionsByGrade[state.grade][0] || null) : null;
      saveData();
      window.alert('Backup restored successfully.');
      state.backupOpen = false;
      render();
    };
    reader.onerror = () => window.alert('Could not read that file.');
    reader.readAsText(file);
  }

            <div class="chip-picker" style="margin:8px 0">

        if(result.ok){

          state.data.signature = e.target.result;

        reader.readAsDataURL(file);

        if(vpin1 || vpin2){
          if(vpin1.length < 4){ window.alert('Choose a viewer access code with at least 4 characters.'); return; }
          if(vpin1 !== vpin2){ window.alert('The two viewer access code entries don\'t match.'); return; }
          if(pin1 && vpin1 === pin1){ window.alert('The viewer code should be different from the admin PIN.'); return; }

        if(newTitle) state.data.title = newTitle;
        state.data.signatureName = sigName;
        saveData();

        if(pin1 && pin1 === pin2){
          state.pin = pin1;
          const ok = await storageAdapter.set('tt-pin', pin1);
          if(!ok) window.alert('Some settings saved, but the new admin PIN could not be saved — please try again.');

        if(vpin1 && vpin1 === vpin2){

          const ok = await storageAdapter.set('tt-viewerpin', vpin1);

        closeModal();

  function renderPeopleModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    const selected = { subjects: new Set(), teachers: new Set() };

    function listBlock(title, key, placeholder){
      let html = '<div class="auto-panel-title" style="margin-top:14px">'+title+'</div>';

      });

      html += '<div class="sub" style="margin:2px 0 0">One name per cell — any sheet layout works, duplicates are skipped</div>';

    }

    function teacherDetailsBlock(){
      const names = (state.data.teachers||[]).slice().sort((a,b) => a.localeCompare(b));
      let html = '<div class="auto-panel-title" style="margin-top:16px">Teacher details</div>';
      html += '<div class="sub">Designation, employment type, and contact — for staff records and the Permanent/Guest filter in All teachers</div>';
      if(!names.length){
        html += '<div class="empty-state">Add teachers above first, then fill in their details here.</div>';

      }
